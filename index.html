<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마감 보스 레이드</title>
<style>
  @font-face {
    font-family: 'DungGeunMo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
    font-weight: normal;
  }
  :root {
    --bg: #1e1e1e; --ink: #f0f0f0; --muted: #aaaaaa; --line: #444;
    --me: #4FB37A; --boss: #D32F2F; --warn: #E0564B; --card: #2a2a2a;
    --accent: #9c27b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DungGeunMo', monospace; }
  body {
    background: var(--bg); color: var(--ink);
    height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;
  }
  .app { width: min(1000px, 98vw); height: min(760px, 98vh); display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
  
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--line); padding-bottom: 10px; }
  .header-left { display: flex; flex-direction: column; gap: 4px; }
  header h1 { font-size: 26px; color: var(--boss); text-shadow: 2px 2px 0px var(--accent); }
  .project-name-input { 
    font-size: 20px; background: transparent; border: none; color: #fff; 
    border-bottom: 1px dashed var(--muted); outline: none; width: 320px; padding: 2px 0;
  }
  .project-name-input:focus { border-bottom-color: #fff; }
  
  .deadline { display: flex; gap: 8px; align-items: center; font-size: 16px; color: var(--ink); }

  /* BGM 설정 컨트롤 */
  .bgm-box { 
    display: flex; align-items: center; gap: 6px; background: #000; border: 2px solid var(--line); 
    padding: 0 8px; height: 35px; box-sizing: border-box;
  }
  .bgm-icon { font-size: 16px; cursor: pointer; user-select: none; transition: transform 0.15s; display: inline-block; }
  .bgm-icon:hover { transform: scale(1.15); }
  .bgm-icon.playing { animation: pulseIcon 1.4s infinite ease-in-out; }
  @keyframes pulseIcon { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px var(--me)); } 50% { transform: scale(1.2); filter: drop-shadow(0 0 6px var(--me)); } }
  .bgm-select { 
    background: transparent; color: var(--ink); border: none; font-size: 14px; 
    padding: 0; outline: none; cursor: pointer;
  }
  .bgm-select option { background: #151515; color: #fff; }

  
  input, select, button { 
    font: inherit; border: 2px solid var(--line); border-radius: 0; 
    padding: 6px 10px; background: #000; color: var(--ink); 
  }
  input[type="datetime-local"] { color-scheme: dark; }
  button { cursor: pointer; text-transform: uppercase; transition: transform 0.1s; z-index: 20; position: relative; }
  button:active { transform: translateY(2px); }
  .btn-main { background: var(--accent); color: #fff; border-color: #fff; }
  .btn-start { background: var(--me); color: #000; border-color: #fff; }
  .btn-stop { background: var(--warn); color: #fff; border-color: #fff; }
  .btn-done { background: var(--boss); color: #fff; border-color: #fff; }

  /* 전장 */
  .arena { 
    background: var(--card); border: 4px solid var(--line); 
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; overflow: hidden; 
    padding: 12px 20px; flex: 0 0 250px; /* 창 사이즈 줄여서 퀘스트 목록 영역 확보 */
  }
  .side { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 10; height: 100%; }
  .side.boss { align-items: flex-end; text-align: right; }
  .side.me { align-items: flex-start; text-align: left; }
  
  .name { font-size: 20px; color: #fff; }
  .bar { width: 100%; height: 20px; background: #000; border: 2px solid var(--line); position: relative; }
  .fill { height: 100%; transition: width 0.8s ease; } 
  .me .fill { background: var(--me); }
  .boss .fill { background: var(--boss); }
  .hp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; text-shadow: 1px 1px 0 #000; }
  
  .sprite-container { flex: 1; display: flex; align-items: center; width: 100%; }
  .boss .sprite-container { justify-content: flex-end; }
  
  .sprite { image-rendering: pixelated; transition: transform 0.8s ease; }
  
  /* 캐릭터 크기 약 75%로 축소 (100px) */
  .player-sprite { height: 100px; position: relative; left: 0; z-index: 15; }
  
  /* 보스 크기 약 75%로 축소 (스케일 제거, 120px 제한 유지) */
  #bossSprite { width: 100%; max-height: 120px; object-fit: contain; object-position: right center; z-index: 15; position: relative; transform-origin: right center; }
  
  .hit { animation: flash 0.8s; } /* 피격 이펙트 느리게 */
  @keyframes flash { 
    0%, 100% { filter: brightness(1); transform: translateX(0); } 
    50% { filter: brightness(3) invert(1); transform: translateX(10px); } 
  }
  
  .attack-move { animation: dash 1s ease-in-out; }
  @keyframes dash { 
    0% { transform: translateX(0); }
    40% { transform: translateX(350px) translateY(-20px); } /* 보스 쪽으로 돌진 */
    60% { transform: translateX(350px) translateY(-20px) scale(1.1); filter: brightness(2); } 
    100% { transform: translateX(0); }
  }

  .shake { animation: shake 0.8s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }

  .msg-box { 
    position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
    background: #000; border: 2px solid #fff; padding: 4px 10px; font-size: 14px;
    text-align: center; z-index: 20;
  }

  /* 잔잔한 불꽃/도트 애니메이션 */
  .spark {
    position: absolute;
    background: var(--warn);
    box-shadow: 0 0 4px var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-20px) translateX(0); opacity: 0; }
    10% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateY(280px) translateX(30px); opacity: 0; }
  }

  /* 퀘스트 목록 */
  .quests { background: var(--card); border: 4px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; z-index: 20; position: relative;}
  .add { display: flex; gap: 8px; }
  .add input[type="text"] { flex: 1; }
  .add input[type="number"] { width: 330px; }
  .add input::placeholder { color: #888; font-size: 13px; }
  
  ul { list-style: none; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; padding-right: 5px; }
  ul::-webkit-scrollbar { width: 8px; }
  ul::-webkit-scrollbar-thumb { background: var(--line); }
  
  /* 아이템이 4.5개 정도 보이도록 높이 조절 */
  li { display: flex; align-items: center; gap: 10px; padding: 12px; background: #000; border: 2px solid var(--line); flex-shrink: 0; height: 75px; }
  li.active { border-color: var(--me); box-shadow: 0 0 5px var(--me); }
  li.done { opacity: 0.4; }
  
  .t-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .t-name { font-size: 18px; }
  .t-done-name { text-decoration: line-through; }
  .t-meta { font-size: 14px; color: var(--muted); }
  .t-time-active { color: var(--me); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.5; } }
  
  .actions { display: flex; gap: 6px; }
  .actions button { padding: 8px 12px; font-size: 14px; }
  
  .dmg-text { position: absolute; font-size: 40px; color: #fff; text-shadow: 2px 2px 0 red; pointer-events: none; animation: floatUp 1.2s forwards; z-index: 30; }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }

  /* 모달 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
  .overlay.show { display: flex; }
  .modal { background: #000; border: 4px solid #fff; padding: 30px; text-align: center; display: flex; flex-direction: column; gap: 20px; min-width: 400px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 40px; color: var(--boss); }
  .modal h2.win { color: var(--me); }
  
  .report-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  .report-table th, .report-table td { border: 1px solid var(--line); padding: 8px; text-align: left; }
  .report-table th { background: #222; }
  .report-total { font-weight: bold; font-size: 18px; margin-top: 10px; color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-left">
      <h1>마감 보스 레이드</h1>
      <input type="text" class="project-name-input" id="projectName" placeholder="프로젝트명 (예: 기획서 작성)">
    </div>
    <div class="deadline">
      <div class="bgm-box" title="배경음악 설정">
        <span class="bgm-icon" id="bgmIcon" title="BGM 켜기/끄기">🔈</span>
        <select id="bgmSelect" class="bgm-select" title="BGM 설정">
          <option value="none">🔈 소리 없음</option>
          <option value="battle1">아드레날린 폭발</option>
          <option value="battle2">최종 전투</option>
          <option value="chill1">꿈꾸는 도전</option>
          <option value="chill2">치유의 길</option>
        </select>
      </div>
      <span id="dlText">마감: </span>
      <input type="datetime-local" id="dl">
      <button class="btn-main" id="startRaidBtn">레이드 시작</button>
    </div>
  </header>

  <section class="arena" id="arena">
    <div class="msg-box" id="msgBox">마감을 정하고 할 일을 추가하세요</div>

    <div class="side me">
      <div class="name">PLAYER</div>
      <div class="bar">
        <div class="fill" id="meBar" style="width:100%"></div>
        <div class="hp-text" id="meHpText">STAMINA 100%</div>
      </div>
      <div class="sprite-container">
        <img src="assets/player.png" class="sprite player-sprite" id="playerSprite" alt="Player">
      </div>
    </div>

    <div class="side boss">
      <div class="name" id="bossNameDisplay">BOSS: 메가돈</div>
      <div class="bar">
        <div class="fill" id="bossBar" style="width:100%"></div>
        <div class="hp-text" id="bossHpText">HP 100/100</div>
      </div>
      <div class="sprite-container" style="justify-content: flex-end;">
        <img src="assets/boss.png" class="sprite" id="bossSprite" alt="Boss">
      </div>
    </div>
  </section>

  <section class="quests">
    <form class="add" id="addForm">
      <input type="text" id="taskIn" placeholder="할 일 입력 (예: 자료 확인하기)" autocomplete="off" required>
      <input type="number" id="estIn" placeholder="예상 시간 (분 - 30분 이하 쪼개쓰기 권장)" min="1" required>
      <button type="submit" id="addBtn">퀘스트 추가</button>
    </form>
    <ul id="list"></ul>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="resTitle"></h2>
    <div id="resDesc" style="font-size: 18px;"></div>
    <div id="resReport"></div>
    <div class="report-total" id="resTotal"></div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
      <button class="btn-main" style="padding:10px 20px; font-size:18px;" onclick="resetGame()">새로운 레이드 준비</button>
    </div>
  </div>
</div>

<script>
  function createSparks() {
    const arena = document.getElementById('arena');
    // 불꽃 도트 이펙트 추가
    for (let i = 0; i < 20; i++) {
      let spark = document.createElement('div');
      spark.className = 'spark';
      spark.style.left = (Math.random() * 100) + '%';
      spark.style.animationDuration = (Math.random() * 3 + 2) + 's';
      spark.style.animationDelay = (Math.random() * 5) + 's';
      
      const sizeOptions = ['2px', '4px', '6px'];
      const size = sizeOptions[Math.floor(Math.random() * sizeOptions.length)];
      spark.style.width = size;
      spark.style.height = size;
      
      arena.appendChild(spark);
    }
  }
  createSparks();

  const KEY = 'mytt_boss_raid_v3';
  let S = JSON.parse(localStorage.getItem(KEY)) || { 
    started: false, 
    deadline: null, 
    startTime: null,
    projectName: '',
    tasks: [], 
    bossMaxHp: 0,
    ended: false 
  };
  
  const $ = id => document.getElementById(id);
  const save = () => localStorage.setItem(KEY, JSON.stringify(S));

  let timer = null;

  function init() {
    if (S.projectName) $('projectName').value = S.projectName;
    if (S.deadline) $('dl').value = new Date(S.deadline - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    if (S.started && !S.ended) {
      $('dl').disabled = true;
      $('projectName').disabled = true;
      $('startRaidBtn').textContent = '포기하기';
      $('startRaidBtn').className = 'btn-stop';
    }
    
    renderList();
    renderArena();
    if (S.started && !S.ended) {
      timer = setInterval(gameLoop, 1000);
    }
  }

  function formatTime(ms) {
    if (ms < 0) ms = 0;
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    if (h > 0) return h + '시간 ' + m + '분 ' + s + '초';
    return m + '분 ' + s + '초';
  }

  function getTaskActTime(t) {
    let act = t.actTime;
    if (t.status === 'active' && t.currentStart) {
      act += (Date.now() - t.currentStart);
    }
    return act;
  }

  function getBossCurrentHp() {
    let hp = 0;
    S.tasks.forEach(t => {
      if (t.status !== 'done') hp += t.estTime;
    });
    return hp;
  }

  function gameLoop() {
    if (S.ended) return;
    
    const now = Date.now();
    const timeLeft = S.deadline - now;
    
    const hasActive = S.tasks.some(t => t.status === 'active');
    if (hasActive) {
      renderList(true); 
    }

    renderArena();

    if (timeLeft <= 0) {
      endGame(false);
    }
  }

  function renderArena() {
    $('bossNameDisplay').textContent = "BOSS: " + (S.projectName || "미지의 보스");

    if (!S.started) {
      $('msgBox').textContent = '프로젝트명과 마감을 설정하고 레이드를 시작하세요!';
      return;
    }

    const now = Date.now();
    const totalTime = S.deadline - S.startTime;
    const timeLeft = Math.max(0, S.deadline - now);
    let mePct = totalTime > 0 ? (timeLeft / totalTime) * 100 : 0;
    mePct = Math.min(100, Math.max(0, mePct));

    $('meBar').style.width = mePct + '%';
    $('meHpText').textContent = '남은 시간: ' + formatTime(timeLeft);
    if (mePct < 20) $('meBar').style.background = 'var(--warn)';
    else $('meBar').style.background = 'var(--me)';

    const curHp = getBossCurrentHp();
    const maxHp = S.bossMaxHp || 1;
    let bossPct = (curHp / maxHp) * 100;
    bossPct = Math.min(100, Math.max(0, bossPct));

    $('bossBar').style.width = bossPct + '%';
    $('bossHpText').textContent = 'HP ' + curHp + ' / ' + S.bossMaxHp;

    if (curHp === 0 && S.tasks.length > 0) {
      endGame(true);
      return;
    }

    const msg = $('msgBox');
    const hpDiff = bossPct - mePct;
    if (curHp === 0) msg.textContent = '적의 숨통을 끊으세요!';
    else if (hpDiff > 20) { msg.textContent = '보스가 너무 강합니다! 서두르세요!'; msg.style.color = 'var(--warn)'; }
    else if (hpDiff < -20) { msg.textContent = '여유롭습니다. 계속 몰아붙이세요!'; msg.style.color = 'var(--me)'; }
    else { msg.textContent = '팽팽한 접전입니다!'; msg.style.color = '#fff'; }
  }

  function renderList(onlyTime = false) {
    const ul = $('list');
    
    if (onlyTime) {
      S.tasks.forEach(t => {
        const span = $('t-act-' + t.id);
        if (span) {
          const actMin = (getTaskActTime(t) / 60000).toFixed(1);
          span.textContent = actMin;
        }
      });
      return;
    }

    if (S.tasks.length === 0) {
      ul.innerHTML = '<li style="justify-content:center; color:var(--muted); height: auto; padding: 20px;">추가된 퀘스트가 없습니다.</li>';
      return;
    }

    ul.innerHTML = S.tasks.map(t => {
      const isDone = t.status === 'done';
      const isActive = t.status === 'active';
      const actMin = (getTaskActTime(t) / 60000).toFixed(1);
      
      let buttons = '';
      if (!isDone) {
        if (!isActive) {
          buttons += `<button class="btn-start" onclick="toggleTask(${t.id})">시작</button>`;
        } else {
          buttons += `<button class="btn-stop" onclick="toggleTask(${t.id})">일시정지</button>`;
        }
        buttons += `<button class="btn-done" onclick="finishTask(${t.id})">완료 (공격!)</button>`;
      }
      
      return `
        <li class="${isActive ? 'active' : ''} ${isDone ? 'done' : ''}">
          <div class="t-info">
            <div class="t-name ${isDone ? 't-done-name' : ''}">${t.text.replace(/</g, '&lt;')}</div>
            <div class="t-meta">
              예상: ${t.estTime}분 | 
              실제: <span id="t-act-${t.id}" class="${isActive ? 't-time-active' : ''}">${actMin}</span>분
            </div>
          </div>
          <div class="actions">
            ${buttons}
          </div>
        </li>
      `;
    }).join('');
  }

  $('projectName').addEventListener('input', (e) => {
    if (!S.started) {
      S.projectName = e.target.value;
      save();
      renderArena();
    }
  });

  $('startRaidBtn').onclick = () => {
    if (S.started && !S.ended) {
      if (confirm('정말 레이드를 포기하시겠습니까?')) endGame(false);
      return;
    }
    
    const dlVal = $('dl').value;
    if (!dlVal) return alert('마감 시간을 설정해주세요.');
    const t = new Date(dlVal).getTime();
    if (t <= Date.now()) return alert('마감은 미래 시간이어야 합니다.');
    
    if (S.tasks.length === 0) return alert('최소 1개의 퀘스트를 추가해야 시작할 수 있습니다.');

    S.started = true;
    S.ended = false;
    S.deadline = t;
    S.startTime = Date.now();
    S.bossMaxHp = getBossCurrentHp();
    save();
    
    $('dl').disabled = true;
    $('projectName').disabled = true;
    $('startRaidBtn').textContent = '포기하기';
    $('startRaidBtn').className = 'btn-stop';
    
    renderList();
    renderArena();
    timer = setInterval(gameLoop, 1000);
  };

  $('addForm').onsubmit = e => {
    e.preventDefault();
    const text = $('taskIn').value.trim();
    const est = parseInt($('estIn').value);
    if (!text || !est) return;

    S.tasks.push({ 
      id: Date.now(), 
      text, 
      estTime: est, 
      actTime: 0, 
      currentStart: null, 
      status: 'pending' 
    });
    
    if (S.started) {
      S.bossMaxHp += est;
      // 보스 힐 이펙트
      showDamage('+' + est + ' HP (강화!)', 'var(--me)');
    }

    $('taskIn').value = '';
    $('estIn').value = '';
    save();
    renderList();
    renderArena();
    
    // 스크롤 맨 아래로
    const list = $('list');
    list.scrollTop = list.scrollHeight;
  };

  window.toggleTask = (id) => {
    if (!S.started) return alert('레이드를 먼저 시작해주세요!');
    
    const task = S.tasks.find(t => t.id === id);
    if (!task) return;
    
    if (task.status === 'active') {
      task.actTime += (Date.now() - task.currentStart);
      task.currentStart = null;
      task.status = 'pending';
    } else {
      // Pause other active tasks correctly
      S.tasks.forEach(t => {
        if (t.status === 'active') {
          t.actTime += (Date.now() - t.currentStart);
          t.currentStart = null;
          t.status = 'pending';
        }
      });
      task.status = 'active';
      task.currentStart = Date.now();
    }
    save();
    renderList();
  };

  window.finishTask = (id) => {
    if (!S.started) return alert('레이드를 먼저 시작해주세요!');
    
    const task = S.tasks.find(t => t.id === id);
    if (!task) return;

    if (task.status === 'active') {
      task.actTime += (Date.now() - task.currentStart);
      task.currentStart = null;
    }
    task.status = 'done';
    save();
    
    renderList();
    
    // 공격 이펙트
    playAttackAnim(task.estTime);
  };

  function playAttackAnim(dmg) {
    const player = $('playerSprite');
    const boss = $('bossSprite');
    const arena = $('arena');
    
    // 돌진 애니메이션

  function showDamage(text, color = 'red') {

    d.style.top = '30%';

  function endGame(win) {
    S.ended = true;
    clearInterval(timer);
    
    S.tasks.forEach(t => {
      if (t.status === 'active') {
        t.actTime += (Date.now() - t.currentStart);
        t.currentStart = null;
        t.status = 'pending';
      }
    });
    save();
    
    const title = $('resTitle');
    title.textContent = win ? '🎉 레이드 성공! 보스 토벌 🎉' : '💀 레이드 실패... 시간 초과 💀';
    title.className = win ? 'win' : '';
    
    $('resDesc').textContent = win ? '마감 시간 전에 모든 퀘스트를 완료했습니다!' : '보스를 물리치지 못했습니다. 하지만 여기까지 온 것도 대단합니다.';
    
    let totalEst = 0;
    let totalAct = 0;
    
    let table = '<table class="report-table"><tr><th>퀘스트</th><th>상태</th><th>예상 시간</th><th>실제 걸린 시간</th><th>차이</th></tr>';
    S.tasks.forEach(t => {
      const isDone = t.status === 'done';
      const actMin = (t.actTime / 60000);
      totalEst += t.estTime;
      totalAct += actMin;
      
      const diff = actMin - t.estTime;
      let diffStr = '';
      if (diff > 0) diffStr = `<span style="color:var(--warn)">+${diff.toFixed(1)}분 (초과)</span>`;
      else if (diff < 0) diffStr = `<span style="color:var(--me)">${diff.toFixed(1)}분 (단축)</span>`;
      else diffStr = '정확함';
      
      table += `<tr>
        <td>${t.text.replace(/</g, '&lt;')}</td>
        <td>${isDone ? '완료' : '미완료'}</td>
        <td>${t.estTime}분</td>
        <td>${actMin.toFixed(1)}분</td>
        <td>${diffStr}</td>
      </tr>`;
    });
    table += '</table>';
    
    $('resReport').innerHTML = table;
    
    const totalDiff = totalAct - totalEst;
    let totalDiffStr = totalDiff > 0 ? `(${totalDiff.toFixed(1)}분 초과)` : `(${Math.abs(totalDiff).toFixed(1)}분 단축)`;
    $('resTotal').innerHTML = `총 예상: ${totalEst}분 <br> 총 실제: ${totalAct.toFixed(1)}분 <br> ${totalDiffStr}`;
    
    $('overlay').classList.add('show');
  }

  init();

  // --- 4-Track Procedural Retro Chiptune & Lo-Fi Audio Engine ---
  class RetroAudioEngine {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.mode = 'none'; // 'none', 'battle1', 'battle2', 'chill1', 'chill2'
      this.lastActiveMode = 'battle1';
      this.timer = null;
      this.step = 0;
      this.noiseBuffer = null;
    }

    ensureContext() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.setValueAtTime(0.20, this.ctx.currentTime);
        this.master.connect(this.ctx.destination);
        this.createNoiseBuffer();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    createNoiseBuffer() {
      const bufferSize = this.ctx.sampleRate * 2;
      this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
    }

    m2f(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    playNote(freq, type, duration, gainVal, when, filterFreq = null, pitchSlide = null) {
      if (!this.ctx || this.mode === 'none') return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, when);

      if (pitchSlide) {
        osc.frequency.linearRampToValueAtTime(pitchSlide, when + duration);
      }

      gain.gain.setValueAtTime(gainVal, when);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);

      if (filterFreq) {
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterFreq, when);
        osc.connect(filter);
        filter.connect(gain);
      } else {
        osc.connect(gain);
      }

      gain.connect(this.master);
      osc.start(when);
      osc.stop(when + duration);
    }

    playDrum(type, when, vol = 1.0) {
      if (!this.ctx || this.mode === 'none') return;
      if (type === 'kick') {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(170, when);
        osc.frequency.exponentialRampToValueAtTime(32, when + 0.09);
        gain.gain.setValueAtTime(0.35 * vol, when);
        gain.gain.exponentialRampToValueAtTime(0.001, when + 0.1);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(when);
        osc.stop(when + 0.1);
      } else if (type === 'snare') {
        if (!this.noiseBuffer) return;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, when);
        filter.Q.setValueAtTime(2.0, when);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.25 * vol, when);
        gain.gain.exponentialRampToValueAtTime(0.001, when + 0.1);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);
        src.start(when);
        src.stop(when + 0.1);
      } else if (type === 'hat') {
        if (!this.noiseBuffer) return;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(5500, when);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.05 * vol, when);
        gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.035);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);
        src.start(when);
        src.stop(when + 0.035);
      } else if (type === 'crash') {
        if (!this.noiseBuffer) return;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(3200, when);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3 * vol, when);
        gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.45);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);
        src.start(when);
        src.stop(when + 0.45);
      }
    }

    setMode(mode) {
      this.mode = mode;
      if (mode !== 'none') this.lastActiveMode = mode;
      this.step = 0;
      if (this.timer) {
        clearInterval(this.timer);
        this.timer = null;
      }
      this.updateUI();

      if (mode === 'none') return;
      this.ensureContext();

      if (mode === 'battle1') {
        // Pokemon Battle Style: 154 BPM (97ms tick)
        this.timer = setInterval(() => this.tickPokemonBattle(), 98);
      } else if (mode === 'battle2') {
        // Arcade Rock / Undertale Style: 146 BPM (102ms tick)
        this.timer = setInterval(() => this.tickArcadeBattle(), 102);
      } else if (mode === 'chill1') {
        // Rainy Lo-Fi: 72 BPM (208ms tick)
        this.timer = setInterval(() => this.tickRainyLofi(), 208);
      } else if (mode === 'chill2') {
        // Cozy Village Walk: 94 BPM (160ms tick)
        this.timer = setInterval(() => this.tickCozyTown(), 160);
      }
    }

    // ==========================================
    // TRACK 1: 긴박한 전투 1 (포켓몬 배틀 테마)
    // ==========================================
    tickPokemonBattle() {
      const now = this.ctx.currentTime + 0.02;
      const step256 = this.step % 256;
      const bar = Math.floor(step256 / 16);
      const subStep = step256 % 16;

      if (bar === 0) {
        if (subStep === 0) this.playDrum('crash', now, 0.9);
        if (subStep >= 12) this.playDrum('snare', now, 0.6 + (subStep - 12) * 0.1);
      } else {
        if (subStep === 0 && (bar === 1 || bar === 5 || bar === 9 || bar === 13)) {
          this.playDrum('crash', now, 0.85);
        }
        if (bar === 7 && subStep >= 12) {
          this.playDrum('snare', now, 0.8);
        } else if (bar === 15 && subStep >= 8) {
          if (subStep % 2 === 0 || subStep >= 12) this.playDrum('snare', now, 0.9);
        } else {
          if (subStep === 0 || subStep === 6 || subStep === 10) this.playDrum('kick', now, 0.9);
          if (subStep === 4 || subStep === 12) this.playDrum('snare', now, 0.85);
          if (subStep % 2 === 0) this.playDrum('hat', now, 0.7);
        }
      }

      if (bar > 0) {
        const bassRoots = [null, 38, 38, 38, 38, 34, 36, 38, 45, 31, 33, 34, 36, 38, 34, 33, 33];
        const r = bassRoots[bar];
        if (r) {
          let note = r;
          let playBass = false;
          if (subStep === 0 || subStep === 6) { note = r; playBass = true; }
          else if (subStep === 1 || subStep === 7) { note = r; playBass = true; }
          else if (subStep === 3 || subStep === 9) { note = r + 12; playBass = true; }
          else if (subStep === 4 || subStep === 10) { note = r; playBass = true; }
          else if (subStep === 12) { note = r + 7; playBass = true; }
          else if (subStep === 14) { note = r + 10; playBass = true; }
          if (playBass) this.playNote(this.m2f(note), 'sawtooth', 0.08, 0.17, now, 520);
        }
      }

      if (bar >= 1) {
        const arpChords = [
          null,
          [62, 65, 69, 74], [62, 65, 69, 74], [62, 65, 69, 74], [62, 65, 69, 74],
          [58, 62, 65, 70], [60, 64, 67, 72], [62, 65, 69, 74], [57, 61, 64, 69],
          [55, 58, 62, 67], [57, 60, 64, 69], [58, 62, 65, 70], [60, 64, 67, 72],
          [62, 65, 69, 74], [58, 62, 65, 70], [57, 61, 64, 69], [57, 61, 64, 69]
        ];
        const chord = arpChords[bar];
        if (chord) {
          const arpNote = chord[subStep % chord.length];
          this.playNote(this.m2f(arpNote), 'square', 0.065, 0.05, now, 1600);
        }
      }

      if (bar === 0) {
        const introPitches = [62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76, 77];
        this.playNote(this.m2f(introPitches[subStep]), 'square', 0.08, 0.13, now, 2400);
      } else {
        const barMelodies = {
          1: [[0, 74, 2], [2, 74, 2], [4, 74, 2], [6, 77, 2], [8, 76, 3], [11, 74, 4]],
          2: [[0, 72, 2], [2, 74, 2], [4, 77, 3], [7, 81, 3], [10, 79, 3], [13, 77, 3]],
          3: [[0, 70, 3], [3, 74, 3], [6, 77, 2], [8, 79, 3], [11, 77, 2], [13, 76, 3]],
          4: [[0, 74, 2], [2, 73, 2], [4, 74, 2], [6, 76, 2], [8, 77, 4], [12, 81, 4]],
          5: [[0, 77, 3], [3, 79, 3], [6, 81, 2], [8, 82, 3], [11, 81, 2], [13, 79, 3]],
          6: [[0, 81, 3], [3, 84, 3], [6, 86, 4], [10, 84, 3], [13, 81, 3]],
          7: [[0, 82, 3], [3, 81, 3], [6, 79, 2], [8, 77, 2], [10, 79, 2], [12, 81, 4]],
          8: [[0, 76, 2], [2, 77, 2], [4, 79, 2], [6, 81, 2], [8, 85, 4], [12, 88, 4]],
          9:  [[0, 79, 3], [3, 82, 3], [6, 86, 4], [10, 84, 3], [13, 82, 3]],
          10: [[0, 81, 3], [3, 84, 3], [6, 88, 4], [10, 86, 3], [13, 84, 3]],
          11: [[0, 82, 3], [3, 86, 3], [6, 89, 4], [10, 88, 3], [13, 86, 3]],
          12: [[0, 85, 3], [3, 86, 3], [6, 88, 3], [9, 89, 4], [13, 91, 3]],
          13: [[0, 91, 3], [3, 89, 3], [6, 88, 3], [9, 86, 3], [12, 85, 4]],
          14: [[0, 85, 2], [2, 86, 2], [4, 88, 2], [6, 89, 2], [8, 91, 4], [12, 93, 4]],
          15: [[0, 93, 3], [3, 91, 3], [6, 88, 3], [9, 85, 4]]
        };
        const notes = barMelodies[bar];
        if (notes) {
          const hit = notes.find(n => n[0] === subStep);
          if (hit) this.playNote(this.m2f(hit[1]), 'square', hit[2] * 0.098, 0.16, now, 2800);
        }
      }
      this.step++;
    }

    // ==========================================
    // TRACK 2: 긴박한 전투 2 (아케이드 록 / 언더테일 풍)
    // ==========================================
    tickArcadeBattle() {
      const now = this.ctx.currentTime + 0.02;
      const step128 = this.step % 128; // 8 bars (146 BPM)
      const bar = Math.floor(step128 / 16);
      const subStep = step128 % 16;

      // Heavy 4-on-the-floor EDM/Rock Beat
      if (subStep % 4 === 0) this.playDrum('kick', now, 0.95);
      if (subStep === 4 || subStep === 12) this.playDrum('snare', now, 0.85);
      if (subStep % 2 === 1) this.playDrum('hat', now, 0.6); // Off-beat hi-hat
      if (subStep === 0 && (bar === 0 || bar === 4)) this.playDrum('crash', now, 0.85);

      // Drum fill on Bar 7
      if (bar === 7 && subStep >= 10) {
        this.playDrum('snare', now, 0.9);
      }

      // Driving Bass (E -> C -> A -> B progression)
      const bassRoots = [40, 40, 36, 36, 33, 33, 35, 35]; // Em, Em, C, C, Am, Am, B, B
      const root = bassRoots[bar];
      // 16th-note relentless synth-bass pulse
      const bassOffsets = [0, 0, 12, 0, 0, 7, 12, 10];
      const bassNote = root + bassOffsets[subStep % 8];
      this.playNote(this.m2f(bassNote), 'sawtooth', 0.09, 0.16, now, 600);

      // Searing Heroic Synth Lead
      const melodyLead = {
        0: [[0, 76, 2], [2, 76, 2], [4, 83, 3], [7, 81, 2], [9, 79, 3], [12, 78, 3]],  // E5-E5-B5-A5-G5-F#5
        1: [[0, 79, 2], [2, 81, 2], [4, 83, 3], [7, 86, 3], [10, 84, 4]],                // G5-A5-B5-D6-C6
        2: [[0, 84, 2], [2, 83, 2], [4, 81, 2], [6, 79, 3], [9, 76, 3], [12, 79, 3]],   // C6-B5-A5-G5-E5-G5
        3: [[0, 81, 2], [2, 83, 2], [4, 84, 3], [7, 86, 3], [10, 88, 4]],                // A5-B5-C6-D6-E6
        4: [[0, 88, 2], [2, 86, 2], [4, 84, 3], [7, 83, 2], [9, 81, 3], [12, 84, 3]],   // E6-D6-C6-B5-A5-C6
        5: [[0, 83, 2], [2, 84, 2], [4, 86, 3], [7, 83, 3], [10, 81, 4]],                // B5-C6-D6-B5-A5
        6: [[0, 87, 2], [2, 87, 2], [4, 90, 3], [7, 88, 2], [9, 87, 3], [12, 83, 3]],   // D#6-D#6-F#6-E6-D#6-B5
        7: [[0, 87, 2], [2, 88, 2], [4, 90, 3], [7, 92, 3], [10, 95, 4]]                 // D#6-E6-F#6-G#6-B6 (Climax!)
      };

      const notes = melodyLead[bar];
      if (notes) {
        const hit = notes.find(n => n[0] === subStep);
        if (hit) this.playNote(this.m2f(hit[1]), 'square', hit[2] * 0.10, 0.17, now, 2600);
      }

      this.step++;
    }

    // ==========================================
    // TRACK 3: 느긋한 도전 1 (비 오는 날 로파이 카페)
    // ==========================================
    tickRainyLofi() {
      const now = this.ctx.currentTime + 0.02;
      const step64 = this.step % 64;
      const bar = Math.floor(step64 / 16);
      const subStep = step64 % 16;

      const chords = [
        { bass: 41, notes: [53, 57, 60, 64] }, // Fmaj7
        { bass: 40, notes: [52, 55, 59, 62] }, // Em7
        { bass: 38, notes: [50, 53, 57, 60] }, // Dm7
        { bass: 36, notes: [48, 52, 55, 59] }  // Cmaj7
      ];
      const chord = chords[bar];

      if (subStep === 0 || subStep === 8) {
        chord.notes.forEach((midi, idx) => {
          this.playNote(this.m2f(midi), 'triangle', 1.8, 0.12, now + idx * 0.035, 850);
        });
      }

      if (subStep === 0 || subStep === 10) {
        this.playNote(this.m2f(chord.bass), 'sine', 1.2, 0.22, now);
      }

      if (subStep % 2 === 0) {
        this.playDrum('hat', now, 0.5);
      }

      if (subStep === 4 || subStep === 12) {
        const bellPitches = [72, 74, 76, 79, 81];
        const pitch = bellPitches[(bar * 2 + subStep / 4) % bellPitches.length];
        this.playNote(this.m2f(pitch), 'sine', 1.4, 0.06, now, 2200);
      }

      this.step++;
    }

    // ==========================================
    // TRACK 4: 느긋한 도전 2 (마을 산책길 / 동물의 숲 / 포켓몬 타운 풍)
    // ==========================================
    tickCozyTown() {
      const now = this.ctx.currentTime + 0.02;
      const step128 = this.step % 128; // 8 bars (94 BPM)
      const bar = Math.floor(step128 / 16);
      const subStep = step128 % 16;

      // Soft Bouncy Acoustic Drums
      if (subStep === 0 || subStep === 8) this.playDrum('kick', now, 0.45);
      if (subStep === 4 || subStep === 12) this.playDrum('snare', now, 0.35);
      if (subStep % 2 === 0) this.playDrum('hat', now, 0.3);

      // Cheerful Walking Bass (G -> C -> D -> G -> Em -> Am -> D -> G)
      const townChords = [
        { bass: [43, 47, 50, 47], keys: [55, 59, 62] }, // G
        { bass: [48, 52, 55, 52], keys: [60, 64, 67] }, // C
        { bass: [50, 54, 57, 54], keys: [62, 66, 69] }, // D
        { bass: [43, 47, 50, 47], keys: [55, 59, 62] }, // G
        { bass: [40, 43, 47, 43], keys: [52, 55, 59] }, // Em
        { bass: [45, 48, 52, 48], keys: [57, 60, 64] }, // Am
        { bass: [50, 54, 57, 54], keys: [62, 66, 69] }, // D7
        { bass: [43, 47, 50, 55], keys: [55, 59, 62] }  // G
      ];
      const currentChord = townChords[bar];

      // Walking Bass notes on 0, 4, 8, 12
      if (subStep % 4 === 0) {
        const bIdx = (subStep / 4) % currentChord.bass.length;
        const bNote = currentChord.bass[bIdx];
        this.playNote(this.m2f(bNote), 'triangle', 0.25, 0.18, now, 700);
      }

      // Ukulele/Guitar warm chord plucks on upbeat (steps 2, 6, 10, 14)
      if (subStep === 2 || subStep === 6 || subStep === 10 || subStep === 14) {
        currentChord.keys.forEach((k, idx) => {
          this.playNote(this.m2f(k), 'triangle', 0.3, 0.08, now + idx * 0.02, 1100);
        });
      }

      // Sunny Sweet Whistle / Flute Melody
      const townMelody = {
        0: [[0, 71, 3], [4, 74, 3], [8, 79, 4], [12, 76, 3]], // B4-D5-G5-E5
        1: [[0, 76, 3], [4, 79, 3], [8, 74, 4], [12, 71, 3]], // E5-G5-D5-B4
        2: [[0, 72, 3], [4, 76, 3], [8, 74, 4], [12, 69, 3]], // C5-E5-D5-A4
        3: [[0, 71, 4], [6, 74, 3], [10, 79, 6]],             // B4-D5-G5
        4: [[0, 79, 2], [2, 81, 2], [4, 83, 3], [8, 81, 2], [10, 79, 4]], // G5-A5-B5-A5-G5
        5: [[0, 76, 3], [4, 79, 3], [8, 81, 4], [12, 79, 3]], // E5-G5-A5-G5
        6: [[0, 78, 2], [2, 79, 2], [4, 81, 3], [8, 74, 6]], // F#5-G5-A5-D5
        7: [[0, 79, 3], [4, 74, 3], [8, 71, 3], [12, 67, 4]] // G5-D5-B4-G4 (Sweet resolve!)
      };

      const notes = townMelody[bar];
      if (notes) {
        const hit = notes.find(n => n[0] === subStep);
        if (hit) this.playNote(this.m2f(hit[1]), 'sine', hit[2] * 0.15, 0.14, now, 1800);
      }

      this.step++;
    }

    updateUI() {
      const icon = document.getElementById('bgmIcon');
      const select = document.getElementById('bgmSelect');
      if (select) select.value = this.mode;
      if (icon) {
        if (this.mode === 'none') {
          icon.textContent = '🔈';
          icon.classList.remove('playing');
          icon.title = 'BGM 꺼짐 (클릭하여 켜기)';
        } else {
          icon.textContent = '🔊';
          icon.classList.add('playing');
          icon.title = 'BGM 재생 중 (클릭하여 끄기)';
        }
      }
    }

    toggle() {
      if (this.mode === 'none') {
        this.setMode(this.lastActiveMode || 'battle1');
      } else {
        this.setMode('none');
      }
    }
  }

    const bgm = new RetroAudioEngine();
  $('bgmSelect').addEventListener('change', (e) => {
    bgm.setMode(e.target.value);
  });
  $('bgmIcon').addEventListener('click', () => {
    bgm.toggle();
  });

</script>
</body>
</html>
