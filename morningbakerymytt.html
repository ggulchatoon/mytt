<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Morning Bakery</title>
<meta name="theme-color" content="#FDF7EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* 한 화면 한 행동: 위에 오늘의 빵 굽기 진행, 가운데 질문, 아래 버튼 하나. 크림 베이커리 단일 테마로 고정 */
:root{color-scheme:light;
  --bg:#FDF7EE;--paper:#FEFAF5;--border:#DFC9A8;--brown:#5C3D2E;--lt-brown:#8E6A4E;
  --amber:#C07A38;--amber-lt:#DFA96E;--cream:#F6E8D3;--green:#5E8A64;--red:#B05040;
  --shadow:rgba(140,90,50,0.09);--r:20px;
  --hand:'Gaegu',cursive;--sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--brown);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{line-height:1.6;background-image:radial-gradient(ellipse at 8% 0%,rgba(230,200,155,.22) 0%,transparent 48%),radial-gradient(ellipse at 94% 98%,rgba(190,215,190,.14) 0%,transparent 48%);font-family:var(--sans);font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:440px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--paper);border-bottom:1.5px solid var(--border);flex-shrink:0}
.brand{display:flex;align-items:center;gap:7px}
.logo{font-family:var(--hand);font-size:23px;font-weight:700;color:var(--amber)}
.logo-icon{width:22px;height:22px;color:var(--amber)}
.hd-time{font-size:13px;color:var(--lt-brown);font-weight:500;font-variant-numeric:tabular-nums}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tab-panel{display:none;padding:16px 16px 22px;min-height:100%}
.tab-panel.active{display:flex;flex-direction:column}
nav{display:flex;border-top:1.5px solid var(--border);background:var(--paper);flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;background:none;border:none;font-family:var(--hand);font-size:14px;font-weight:700;color:var(--lt-brown)}
.nav-btn svg{width:22px;height:22px;stroke:currentColor}
.nav-btn.active{color:var(--amber)}
img.ill{mix-blend-mode:multiply;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}

/* buttons */
.btn{width:100%;padding:17px;border:none;border-radius:16px;font-family:var(--hand);font-size:22px;font-weight:700;transition:transform .13s,opacity .13s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn-amber{background:var(--amber);color:#fff;box-shadow:0 4px 14px rgba(192,122,56,.32)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(94,138,100,.30)}
.btn-ghost{background:var(--paper);color:var(--lt-brown);border:1.5px solid var(--border);box-shadow:none}
.link-btn{background:none;border:none;color:var(--lt-brown);font-size:14px;font-weight:500;padding:8px 6px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}

/* ── 오늘의 빵 굽기 진행 ── */
.oven{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.oven-bread{width:58px;height:50px;flex:0 0 58px;display:flex;align-items:flex-end;justify-content:center}
.oven-bread img{max-width:58px;max-height:50px;transition:filter .6s}
.oven-txt{flex:1;min-width:0}
.oven-name{font-family:var(--hand);font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oven-name span{color:var(--lt-brown);font-weight:400}
.oven-bar{display:flex;gap:4px;margin-top:6px}
.oven-bar i{flex:1;height:6px;border-radius:9px;background:#EADBC4;transition:background .4s}
.oven-bar i.on{background:var(--amber-lt)}
.oven-bar i.cur{background:linear-gradient(90deg,var(--amber-lt),#EADBC4);animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.back{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--lt-brown)}

/* ── 한 화면 한 행동 ── */
.screen{flex:1;display:flex;flex-direction:column;animation:slideIn .35s ease both}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ask{font-family:var(--hand);font-size:34px;font-weight:700;line-height:1.32;letter-spacing:-.3px;margin:10px 2px 10px}
.ask-sub{font-size:15px;color:var(--lt-brown);line-height:1.75;margin:0 2px 24px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.foot{padding-top:14px}

/* intro */
.open-sign{display:inline-flex;padding:4px 14px;border-radius:99px;background:var(--amber);color:#fff;font-family:var(--hand);font-size:15px;font-weight:700;letter-spacing:1px;margin-bottom:10px}
.intro-clock{font-family:var(--hand);font-size:72px;font-weight:700;line-height:1;letter-spacing:-1px}
.intro-date{font-size:14px;color:var(--lt-brown);margin:6px 0 10px}
.hero{position:relative;width:230px;height:160px;margin:8px auto 6px}
.hero .cup{position:absolute;right:0;bottom:0;width:120px}
.hero .bread{position:absolute;left:0;bottom:6px;width:126px;max-height:120px}
.steam{position:absolute;right:46px;top:-4px;display:flex;gap:7px}
.steam span{width:5px;height:26px;border-radius:9px;background:linear-gradient(transparent,rgba(155,115,85,.35));animation:steam 2.4s ease-in-out infinite}
.steam span:nth-child(2){animation-delay:.5s;height:32px}.steam span:nth-child(3){animation-delay:1s}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px) scaleY(1.1)}}
.today-bread{font-family:var(--hand);font-size:24px;font-weight:700;margin-top:4px}
.today-bread b{color:var(--amber)}
.today-sub{font-size:14px;color:var(--lt-brown);margin-top:4px}

/* 1. 컨디션 */
.answers{display:flex;flex-direction:column;gap:16px}
.answer{display:flex;align-items:center;gap:16px;width:100%;padding:22px 20px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--paper);text-align:left;box-shadow:0 4px 16px var(--shadow);transition:all .15s}
.answer img{width:76px;height:76px;flex:0 0 76px}
.answer span{font-family:var(--hand);font-size:23px;font-weight:700;line-height:1.4}
.answer:active,.answer[aria-pressed=true]{border-color:var(--amber);background:#FBEEDD}
.reply{font-family:var(--hand);font-size:22px;font-weight:700;color:var(--amber);text-align:center;min-height:30px;margin-top:16px}

/* 2·3. 단일 행동 */
.big-act{font-family:var(--hand);font-size:44px;font-weight:700;line-height:1.32;letter-spacing:-.5px;margin:22px 0 14px}
.big-act-sm{font-size:34px;line-height:1.38}
.act-sub{font-size:15px;color:var(--lt-brown);line-height:1.8}
.glass{width:150px;height:150px;margin:0 auto}

/* 4. 첫 할 일 */
input[type=text],textarea{width:100%;background:var(--paper);border:1.5px solid var(--border);border-radius:16px;padding:18px 18px;outline:none;font-family:var(--sans);font-size:16px;line-height:1.8;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--amber)}
textarea{resize:none;min-height:150px}
.ask-sm{font-size:30px;margin:4px 2px 16px}
.order{background:var(--cream);border-radius:18px;padding:18px 26px 22px}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--lt-brown);font-weight:500}
.order-in{margin-top:12px;background:var(--paper)}
.memo-wrap{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:20px}
.memo-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:700;margin:0 2px 8px}
.memo-head .count{margin:0;font-weight:400}
textarea.lined{flex:1;min-height:110px;font-family:var(--hand);font-size:20px;line-height:34px;padding:6px 16px;background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0 33px,#EADBC4 33px 34px);background-position:0 5px;background-attachment:local}
.count{text-align:right;font-size:12.5px;color:var(--lt-brown);margin-top:6px;font-variant-numeric:tabular-nums}
.count.full{color:var(--red);font-weight:700}

/* 완료 */
.got{font-family:var(--hand);font-size:20px;color:var(--lt-brown);font-weight:700}
.got-bread{width:170px;height:150px;margin:6px auto 2px;display:flex;align-items:flex-end;justify-content:center}
.got-bread img{max-width:170px;max-height:150px;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3) translateY(20px) rotate(-10deg)}to{opacity:1;transform:none}}
.got-name{font-family:var(--hand);font-size:34px;font-weight:700;line-height:1.1}
.got-sub{font-size:14px;color:var(--lt-brown);margin:6px 0 16px}
.recap{width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--border);border-radius:16px;padding:20px 20px;margin-bottom:14px}
.recap .k{font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.3px}
.recap .v{font-size:15.5px;font-weight:500;line-height:1.7;margin-top:4px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.recap .v+.k{margin-top:14px}

/* 쿠폰 */
.coupon{position:relative;width:100%;background:var(--paper);border:1.5px solid var(--border);border-radius:18px;padding:22px 20px 18px;box-shadow:0 4px 18px var(--shadow)}
.coupon::before,.coupon::after{content:'';position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);transform:translateY(-50%)}
.coupon::before{left:-10px;clip-path:inset(0 0 0 50%)}
.coupon::after{right:-10px;clip-path:inset(0 50% 0 0)}
.cp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.cp-head b{font-family:var(--hand);font-size:21px}
.cp-head span{font-size:13px;color:var(--lt-brown);font-weight:500}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:1.8px dashed var(--border);display:flex;align-items:center;justify-content:center;background:var(--bg)}
.stamp .n{font-family:var(--hand);font-size:16px;color:#D9C3A2;font-weight:700}
.stamp.on{border:2px solid rgba(192,122,56,.5);background:#F8EAD6}
.stamp.on img{width:78%;height:78%}
.stamp.new{animation:stampIn .6s .25s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampIn{0%{transform:scale(2.3) rotate(-20deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.stamp.gift{border-style:solid;border-color:var(--amber-lt)}
.stamp.gift .n{color:var(--amber);font-size:14px;line-height:1.05;text-align:center}
.cp-foot{font-size:12.5px;color:var(--lt-brown);text-align:center;margin-top:12px}

/* 빵 도감 / 기록 */
.s-title{font-family:var(--hand);font-size:19px;font-weight:700;color:var(--lt-brown);margin:4px 2px 8px}
.card{background:var(--paper);border:1.5px solid var(--border);border-radius:var(--r);padding:20px 20px;box-shadow:0 4px 16px var(--shadow);margin-bottom:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wk .im{height:46px;display:flex;align-items:flex-end;justify-content:center}
.wk img{max-width:42px;max-height:46px}
.wk.off img{filter:grayscale(1) opacity(.2)}
.wk b{font-family:var(--hand);font-size:16px;color:var(--lt-brown)}
.wk.today b{color:var(--amber)}
.wk.off b{opacity:.6}
.week-sum{text-align:center;font-family:var(--hand);font-size:18px;font-weight:700;margin-top:12px}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;text-align:center}
.dex .it{display:flex;flex-direction:column;align-items:center;gap:3px}
.dex .im{height:52px;display:flex;align-items:flex-end}
.dex img{max-width:52px;max-height:52px}
.dex .nm{font-family:var(--hand);font-size:15px;font-weight:700;line-height:1.1;word-break:keep-all}
.dex .ct{font-size:12px;color:var(--lt-brown);font-variant-numeric:tabular-nums}
.dex .it.none img{filter:grayscale(1) opacity(.2)}
.dex .it.none .nm{color:#C9B394}
.hist{display:flex;flex-direction:column}
.h{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #EFE2CD}
.h:last-child{border-bottom:none}
.h .im{flex:0 0 42px;height:40px;display:flex;align-items:center;justify-content:center}
.h img{max-width:42px;max-height:40px}
.h .bd{flex:1;min-width:0}
.h .dt{font-size:13px;font-weight:700}
.h .dt span{font-weight:400;color:var(--lt-brown);margin-left:4px}
.h .ft{font-size:13.5px;margin-top:4px;line-height:1.6}
.h .mm{font-size:13px;color:var(--lt-brown);margin-top:5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}

/* 설정 */
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #EFE2CD;font-size:15px;font-weight:500}
.row:last-child{border-bottom:none}
.row small{display:block;font-size:12.5px;font-weight:400;color:var(--lt-brown);margin-top:3px;line-height:1.6}
.row-col{flex-direction:column;align-items:stretch;gap:10px}
.row-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cfg-in{padding:12px 14px!important;font-size:14.5px!important;border-radius:12px!important;background:var(--bg)!important}
.sub-rows{display:flex;flex-direction:column;background:var(--bg);border:1px solid #EADBC4;border-radius:14px;padding:4px 14px}
.sub-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;font-size:14px;font-weight:500;border-bottom:1px dashed #EADBC4}
.sub-row:last-child{border-bottom:none}
.chip{padding:7px 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--paper);font-size:14px;font-weight:700;color:var(--lt-brown);flex-shrink:0}
.chip[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#fff}
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:1.5px solid #D5BF9F;background:#E5D4BC;padding:0;flex-shrink:0;transition:background .2s,border-color .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#FFFDF9;box-shadow:0 2px 5px rgba(92,61,46,.18);transition:transform .22s cubic-bezier(.34,1.3,.64,1)}
.sw[aria-checked=true]{background:var(--amber);border-color:var(--amber)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.copy-card{background:var(--cream);border-style:dashed;text-align:center;font-size:12.5px;color:var(--lt-brown);line-height:1.75;padding:16px 18px;box-shadow:none;margin-top:10px;margin-bottom:4px}
.copy-right{font-weight:700;color:var(--brown);margin-top:4px;font-size:12px}

#toast{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 8px);left:50%;transform:translateX(-50%) translateY(-12px);background:var(--brown);color:#FDF7EE;font-family:var(--hand);font-size:18px;font-weight:700;padding:10px 22px;border-radius:99px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header>
    <div class="brand">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c0-4.97 4.03-9 9-9s9 4.03 9 9"/><rect x="2" y="17" width="20" height="4" rx="2"/></svg>
      <span class="logo">Morning Bakery</span>
    </div>
    <span class="hd-time" id="hdTime"></span>
  </header>
  <div id="content">
    <div id="panel-routine" class="tab-panel active"></div>
    <div id="panel-coupon" class="tab-panel"></div>
    <div id="panel-settings" class="tab-panel"></div>
  </div>
  <nav>
    <button class="nav-btn active" data-panel="routine"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c0-4.97 4.03-9 9-9s9 4.03 9 9"/><rect x="2" y="17" width="20" height="4" rx="2"/></svg>모닝 루틴</button>
    <button class="nav-btn" data-panel="coupon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M8 6v2M8 16v2M16 6v2M16 16v2"/><circle cx="12" cy="12" r="2"/></svg>빵 모음</button>
    <button class="nav-btn" data-panel="settings"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>설정</button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){

/* ═════════ 날짜 ═════════ */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
// 새벽 4시 전까지는 전날 아침으로 쳐요
function rDate(){const d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);return d}
const todayKey=()=>keyOf(rDate());
const breadOf=k=>{const [y,m,d]=k.split('-').map(Number);return BREADS[new Date(y,m-1,d).getDay()]};

/* ═════════ 저장 (이 브라우저 localStorage) ═════════ */
const LS_DAYS='mb3_days',LS_CFG='mb3_cfg';
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let days=ls.get(LS_DAYS,{});
let cfg=Object.assign({},DEF_CFG,ls.get(LS_CFG,{}));
if(!stepsOf(cfg).length){cfg.water=true;ls.set(LS_CFG,cfg)}
const saveCfg=()=>ls.set(LS_CFG,cfg);
const getSteps=()=>stepsOf(cfg);
const PER=5; // 쿠폰 한 장 = 도장 5개
function blank(){return {step:0,started:null,finished:null,mood:null,first:null,memo:'',stamp:false}}
function rec(){
  const k=todayKey(),steps=getSteps();
  if(!days[k])days[k]=blank();
  if(days[k].step>=steps.length)days[k].step=Math.max(0,steps.length-1);
  if(days[k].step<0)days[k].step=0;
  return days[k];
}
function persist(){ls.set(LS_DAYS,days)}
function removeDay(k){delete days[k];ls.set(LS_DAYS,days)}

/* ═════════ 유틸 ═════════ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const scrollTop=()=>{$('#content').scrollTop=0};
const BACK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';

/* ═════════ 루틴 ═════════ */
let curTab='routine';
function renderRoutine(){
  const r=rec(),p=$('#panel-routine'),steps=getSteps();
  if(!r.started){p.innerHTML=introHTML();$('#openBtn').onclick=()=>{r.started=Date.now();r.step=0;persist();vib([20,40,20]);renderRoutine()};return}
  if(r.finished){p.innerHTML=doneHTML();bindDone();return}
  const id=steps[r.step];
  p.innerHTML=ovenHTML(r.step,steps)+`<div class="screen" id="screen">${SCREEN[id].html(r)}</div>`;
  $('#backBtn').onclick=()=>{if(r.step===0)r.started=null;else r.step--;persist();renderRoutine();scrollTop()};
  SCREEN[id].bind(r);
}
function next(){const r=rec(),steps=getSteps();vib(30);if(r.step<steps.length-1){r.step++;persist();renderRoutine();scrollTop()}else finish()}
function ovenHTML(step,steps){
  const b=breadOf(todayKey());
  return `<div class="oven">
    <button class="back" id="backBtn" aria-label="이전">${BACK}</button>
    <div class="oven-txt"><div class="oven-name">${esc(b.name)} 굽는 중 <span>${step+1}/${steps.length}</span></div>
    <div class="oven-bar">${steps.map((_,i)=>`<i class="${i<step?'on':i===step?'cur':''}"></i>`).join('')}</div></div>
    <div class="oven-bread"><img class="ill" src="${b.img}" style="filter:${bakeFilter(step,steps.length)}" alt=""></div>
  </div>`;
}
function introHTML(){
  const n=new Date(),b=breadOf(todayKey()),wk=weekCount();
  return `<div class="center">
    <span class="open-sign">OPEN</span>
    <div class="intro-clock" id="introClock">${hm(n)}</div>
    <div class="intro-date">${n.getMonth()+1}월 ${n.getDate()}일 ${DAY[n.getDay()]}요일</div>
    <div class="hero"><img class="ill bread" src="${b.img}" alt="${esc(b.name)}"><div class="steam"><span></span><span></span><span></span></div><img class="ill cup" src="${IMG.coffee}" alt=""></div>
    <div class="today-bread">오늘의 빵은 <b>${esc(b.name)}</b></div>
    <div class="today-sub">${wk?`이번 주 빵 ${wk}개 모았어요 · `:''}루틴을 끝내면 이 빵을 받아요</div>
  </div>
  <div class="foot"><button class="btn btn-amber" id="openBtn">베이커리 문 열기</button></div>`;
}

const SCREEN={
  /* 1 · 컨디션 */
  mood:{
    html:r=>`<div class="ask">좋은 아침이에요<br>오늘 컨디션 어때요?</div>
      <div class="ask-sub">지금 내 마음에 가까운 쪽을 눌러요.</div>
      <div class="answers">${Object.entries(MOODS).map(([k,m])=>`<button class="answer" data-mood="${k}" aria-pressed="${r.mood===k}"><img class="ill" src="${MOOD_IMG[k]}" alt=""><span>${m.say}</span></button>`).join('')}</div>
      <div class="reply" id="reply"></div>`,
    bind:r=>document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{
      r.mood=b.dataset.mood;persist();
      document.querySelectorAll('[data-mood]').forEach(x=>x.setAttribute('aria-pressed',x===b));
      $('#reply').textContent=MOODS[r.mood].reply;
      document.querySelectorAll('[data-mood]').forEach(x=>x.disabled=true);
      setTimeout(next,850);
    })
  },
  /* 2 · 물 마시기 */
  water:{
    html:()=>`<div class="center">
      ${GLASS}
      <div class="big-act">일어나서<br>물 마셔요</div>
      <div class="act-sub">지금 이것 하나만 해요.</div>
    </div>
    <div class="foot"><button class="btn btn-green" id="nextBtn">마셨어요</button></div>`,
    bind:()=>{$('#nextBtn').onclick=()=>{toast('잘했어요!');next()}}
  },
  /* 3 · 착석 */
  seat:{
    html:()=>`<div class="center">
      <div class="hero" style="height:140px;width:210px"><img class="ill bread" src="${breadOf(todayKey()).img}" style="width:104px" alt=""><img class="ill cup" src="${IMG.coffee}" style="width:110px" alt=""></div>
      <div class="big-act">내 자리에<br>앉아요</div>
      <div class="act-sub">책상이든 식탁이든 좋아요.<br>앉으면 오늘이 시작돼요.</div>
    </div>
    <div class="foot"><button class="btn btn-amber" id="nextBtn">앉았어요</button></div>`,
    bind:()=>{$('#nextBtn').onclick=()=>{toast('착석 완료!');next()}}
  },
  /* 4 · 나만의 미션 */
  custom:{
    html:()=>{
      const txt=cfg.customText.trim()||'나만의 작은 미션 하기';
      const cls=[...txt].length>14?'big-act big-act-sm':'big-act';
      return `<div class="center">
        ${CUSTOM_SVG}
        <div class="${cls}" style="word-break:keep-all;overflow-wrap:anywhere">${esc(txt)}</div>
        <div class="act-sub">내가 직접 정한 아침 미션이에요.</div>
      </div>
      <div class="foot"><button class="btn btn-amber" id="nextBtn">했어요</button></div>`;
    },
    bind:()=>{$('#nextBtn').onclick=()=>{toast('잘했어요!');next()}}
  },
  /* 5 · 오늘의 첫 빵: 첫 할 일 + 한마디 (스크롤 없이 한 화면) */
  first:{
    html:r=>`<div class="ask ask-sm">오늘의 첫 빵을<br>구워볼까요</div>
      ${cfg.firstTask?`<div class="order">
        <div class="order-top"><span>제일 먼저 할 일</span></div>
        <input type="text" id="firstIn" class="order-in" maxlength="80" placeholder="지금 바로 시작할 한 가지" value="${esc(r.first?.t||'')}" autocomplete="off">
      </div>`:''}
      ${cfg.firstMemo?`<div class="memo-wrap" style="${cfg.firstTask?'':'margin-top:4px'}">
        <div class="memo-head"><span>오늘을 시작하는 한마디</span><span class="count" id="cnt"></span></div>
        <textarea id="memo" class="lined" maxlength="${MEMO_MAX}" placeholder="각오, 다짐, 떠오른 아이디어…">${esc(r.memo)}</textarea>
      </div>`:`<div style="flex:1"></div>`}
      <div class="foot"><button class="btn btn-amber" id="nextBtn">쿠폰 받기</button></div>`,
    bind:r=>{
      const inp=$('#firstIn'),t=$('#memo'),c=$('#cnt');let tm;
      const upd=()=>{
        if(inp)$('#nextBtn').disabled=!inp.value.trim();
        else if(t)$('#nextBtn').disabled=!t.value.trim();
        if(t&&c){
          const len=[...t.value].length;
          c.textContent=`${len} / ${MEMO_MAX}`;
          c.classList.toggle('full',len>=MEMO_MAX);
        }
      };
      upd();
      if(inp)inp.oninput=()=>{r.first=inp.value.trim()?{t:inp.value.trim()}:null;upd();clearTimeout(tm);tm=setTimeout(()=>persist(),800)};
      if(t)t.oninput=()=>{upd();r.memo=t.value.slice(0,MEMO_MAX);clearTimeout(tm);tm=setTimeout(()=>persist(),800)};
      $('#nextBtn').onclick=()=>{
        r.first=inp&&inp.value.trim()?{t:inp.value.trim()}:null;
        r.memo=t?t.value.slice(0,MEMO_MAX):'';
        persist();next();
      };
    }
  }
};
const GLASS=`<svg class="glass" viewBox="0 0 160 160" aria-hidden="true"><defs><filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></defs>
  <g filter="url(#crayon)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 34 L56 138 Q57 146 65 146 L95 146 Q103 146 104 138 L114 34 Z" fill="#EEF5F7" stroke="#B9CDD3" stroke-width="3"/>
    <path d="M51 72 L58 136 Q59 141 65 141 L95 141 Q101 141 102 136 L109 72 Q80 80 51 72 Z" fill="#CFE4EC" opacity=".9"/>
    <path d="M62 86 Q66 110 64 130" stroke="#fff" stroke-width="4" opacity=".7" fill="none"/>
  </g></svg>`;
const CUSTOM_SVG=`<svg class="glass" viewBox="0 0 160 160" aria-hidden="true"><defs><filter id="crayon2"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></defs>
  <g filter="url(#crayon2)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="34" width="92" height="102" rx="14" fill="#FEFAF5" stroke="#DFC9A8" stroke-width="3" transform="rotate(-3 80 85)"/>
    <circle cx="80" cy="34" r="8" fill="#DFA96E" stroke="#C07A38" stroke-width="2.5"/>
    <path d="M80 58 L85 70 L98 71 L88 80 L91 93 L80 86 L69 93 L72 80 L62 71 L75 70 Z" fill="#FBEEDD" stroke="#C07A38" stroke-width="2.6"/>
    <path d="M56 112 L104 110 M64 123 L96 122" stroke="#DFC9A8" stroke-width="3"/>
  </g></svg>`;

/* ═════════ 완료 · 쿠폰 ═════════ */
function finish(){const r=rec();r.finished=Date.now();r.stamp=true;persist();vib([60,40,120]);renderRoutine();scrollTop()}
const stampKeys=()=>Object.keys(days).filter(k=>days[k].stamp).sort();
function doneHTML(){
  const r=rec(),k=todayKey(),b=breadOf(k),mins=Math.max(1,Math.round((r.finished-r.started)/60000));
  const total=stampKeys().length,per=PER,full=total%per===0,hasFirst=getSteps().includes('first');
  return `<div class="center" style="justify-content:flex-start">
    <div class="got">오늘의 빵을 받았어요</div>
    <div class="got-bread"><img class="ill" src="${b.img}" alt="${esc(b.name)}"></div>
    <div class="got-name">${esc(b.name)}</div>
    <div class="got-sub">${hm(new Date(r.started))}에 문 열고 ${mins}분 만에 다 구웠어요</div>
    ${(r.first||r.memo)?`<div class="recap">${r.first?`<div class="k">지금 바로 · 첫 할 일</div><div class="v">${esc(r.first.t)}</div>`:''}${r.memo?`<div class="k">오늘의 한마디</div><div class="v">${esc(r.memo)}</div>`:''}</div>`:''}
    ${couponHTML(true)}
    ${full?`<div class="recap" style="margin-top:12px;border-color:var(--amber-lt);background:#FBEEDD"><div class="v">쿠폰 ${per}칸 완성! 오늘은 진짜 베이커리에 가서 좋아하는 빵과 커피 한 잔 사 먹어요.</div></div>`:''}
    <div style="display:flex;gap:14px;margin-top:10px"><button class="link-btn" data-goto="coupon">이번 주 빵 모음 보기</button>${hasFirst?`<button class="link-btn" id="reopen">다짐 고치기</button>`:''}</div>
  </div>`;
}
function bindDone(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>switchTab(b.dataset.goto));
  const ro=$('#reopen');
  if(ro)ro.onclick=()=>{const r=rec(),s=getSteps();r.finished=null;r.step=Math.max(0,s.indexOf('first'));persist();renderRoutine()};
}
function couponHTML(animate){
  const per=PER,keys=stampKeys(),total=keys.length;
  const card=Math.floor(Math.max(0,total-1)/per),list=keys.slice(card*per,card*per+per),inCard=list.length;
  let cells='';
  for(let i=0;i<per;i++){
    const k=list[i];
    if(k)cells+=`<div class="stamp on ${animate&&k===todayKey()?'new':''}" title="${k}"><img class="ill" src="${breadOf(k).img}" alt="${k}"></div>`;
    else cells+=i===per-1?`<div class="stamp gift"><span class="n">커피<br>한 잔</span></div>`:`<div class="stamp"><span class="n">${i+1}</span></div>`;
  }
  return `<div class="coupon"><div class="cp-head"><b>모닝 쿠폰 ${card+1}장째</b><span>${inCard} / ${per}</span></div><div class="stamps">${cells}</div><div class="cp-foot">루틴을 끝낸 날, 그 요일의 빵 도장을 찍어줘요</div></div>`;
}
function weekKeys(){const t=rDate(),mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7));return [...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return keyOf(d)})}
const weekCount=()=>weekKeys().filter(k=>days[k]?.stamp).length;

/* ═════════ 빵 모음 탭 ═════════ */
function renderCoupon(){
  const wk=weekKeys(),got=wk.filter(k=>days[k]?.stamp).length,keys=stampKeys();
  const cnt=BREADS.map((_,i)=>keys.filter(k=>breadOf(k)===BREADS[i]).length);
  const order=[1,2,3,4,5,6,0];
  const hist=Object.keys(days).filter(k=>days[k].started).sort().reverse().slice(0,40);
  $('#panel-coupon').innerHTML=`
    <div class="s-title">이번 주 빵 모음</div>
    <div class="card"><div class="week">${wk.map(k=>{const on=days[k]?.stamp,[y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);return `<div class="wk ${on?'':'off'} ${k===todayKey()?'today':''}"><div class="im"><img class="ill" src="${breadOf(k).img}" alt=""></div><b>${DAY[dt.getDay()]}</b></div>`}).join('')}</div>
      <div class="week-sum">${got===7?'일주일 빵을 전부 모았어요! 🥐':got?`7개 중 ${got}개 모았어요`:'이번 주 첫 빵을 기다리는 중'}</div></div>
    <div class="s-title">쿠폰</div>
    <div style="margin-bottom:16px">${couponHTML(false)}</div>
    <div class="s-title">빵 도감</div>
    <div class="card"><div class="dex">${order.map(i=>`<div class="it ${cnt[i]?'':'none'}"><div class="im"><img class="ill" src="${BREADS[i].img}" alt=""></div><div class="nm">${esc(BREADS[i].name)}</div><div class="ct">${DAY[i]}요일 · ${cnt[i]}개</div></div>`).join('')}<div class="it"><div class="im"><img class="ill" src="${IMG.coffee}" alt=""></div><div class="nm">커피</div><div class="ct">쿠폰 ${Math.floor(keys.length/PER)}장 완성</div></div></div></div>
    <div class="s-title">지난 아침들</div>
    <div class="card hist">${hist.length?hist.map(k=>{const d=days[k],[y,m,dd]=k.split('-').map(Number),dt=new Date(y,m-1,dd);return `<div class="h"><div class="im"><img class="ill" src="${breadOf(k).img}" style="${d.stamp?'':'filter:grayscale(1) opacity(.3)'}" alt=""></div><div class="bd"><div class="dt">${m}/${dd} (${DAY[dt.getDay()]})<span>${d.mood==='fresh'?'상쾌':d.mood==='tired'?'피곤':''}${d.finished?` · ${hm(new Date(d.started))} 시작 · ${Math.max(1,Math.round((d.finished-d.started)/60000))}분`:' · 굽다 말았어요'}</span></div>${d.first?`<div class="ft">${esc(d.first.t)}</div>`:''}${d.memo?`<div class="mm">${esc(d.memo)}</div>`:''}</div></div>`}).join(''):`<div class="act-sub" style="text-align:center;padding:14px 0">첫 아침을 기다리고 있어요</div>`}</div>`;
}

/* ═════════ 설정 탭 ═════════ */
function renderSettings(){
  $('#panel-settings').innerHTML=`
    <div class="s-title">나만의 아침 미션</div>
    <div class="card">
      <div class="act-sub" style="font-size:13.5px;margin-bottom:4px">내 아침 리듬에 맞게 미션을 켜고 끌 수 있어요.</div>
      <div class="row">
        <div>컨디션 체크<small>오늘 아침 내 기분을 먼저 살펴봐요</small></div>
        <button class="sw" role="switch" aria-label="컨디션 체크" data-cfg="mood" aria-checked="${cfg.mood}"></button>
      </div>
      <div class="row">
        <div>물 마시기<small>일어나서 물 마셔요</small></div>
        <button class="sw" role="switch" aria-label="물 마시기" data-cfg="water" aria-checked="${cfg.water}"></button>
      </div>
      <div class="row">
        <div>자리에 앉기<small>책상이든 식탁이든 내 자리에 앉아요</small></div>
        <button class="sw" role="switch" aria-label="자리에 앉기" data-cfg="seat" aria-checked="${cfg.seat}"></button>
      </div>
      <div class="row row-col">
        <div class="row-head">
          <div>나만의 미션 설정<small>내가 직접 정한 작은 행동을 추가해요</small></div>
          <button class="sw" role="switch" aria-label="나만의 미션 설정" id="customTog" data-cfg="custom" aria-checked="${cfg.custom}"></button>
        </div>
        <input type="text" id="customIn" class="cfg-in" maxlength="40" placeholder="예: 창문 열고 환기하기, 영양제 먹기" value="${esc(cfg.customText)}" autocomplete="off">
      </div>
      <div class="row row-col">

        <div class="sub-rows">
          <div class="sub-row">
            <span>제일 먼저 할 일</span>
            <button class="sw" role="switch" aria-label="제일 먼저 할 일" data-cfg="firstTask" aria-checked="${cfg.firstTask}"></button>
          </div>
          <div class="sub-row">
            <span>오늘 시작하는 한마디</span>
            <button class="sw" role="switch" aria-label="오늘 시작하는 한마디" data-cfg="firstMemo" aria-checked="${cfg.firstMemo}"></button>
          </div>
        </div>
      </div>
    </div>
    <div class="s-title">기록</div>
    <div class="card"><div class="row"><div>오늘 루틴 처음부터<small>오늘 받은 도장도 함께 지워져요.</small></div><button class="chip" id="resetToday">리셋</button></div></div>
    <div class="act-sub" style="text-align:center;font-size:12.5px">Morning Bakery · 새벽 4시 전까지는 전날 아침으로 쳐요</div>
    <div class="card copy-card">
      mytt 클래스 개인 학습용으로 수정 가능하며,<br>
      무단 재배포 및 상업적 판매를 금합니다.
      <div class="copy-right">© 2026 mytt. All rights reserved.</div>
    </div>`;
  document.querySelectorAll('[data-cfg]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.cfg,nextCfg=Object.assign({},cfg,{[k]:!cfg[k]});
    if(!stepsOf(nextCfg).length){toast('미션은 최소 하나는 켜두어야 해요!');return}
    cfg[k]=!cfg[k];saveCfg();vib(15);

  $('#resetToday').onclick=e=>{const b=e.currentTarget;if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='정말 리셋';return}removeDay(todayKey());toast('오늘 기록을 지웠어요');switchTab('routine')};
}

/* ═════════ 탭 · 시작 ═════════ */
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===t));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+t));
  rerender();scrollTop();
}
function rerender(){({routine:renderRoutine,coupon:renderCoupon,settings:renderSettings})[curTab]()}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.panel));
function tick(){const n=new Date();$('#hdTime').textContent=`${n.getMonth()+1}/${n.getDate()} (${DAY[n.getDay()]}) ${hm(n)}`;const c=$('#introClock');if(c)c.textContent=hm(n)}
let lastKey=todayKey();
renderRoutine();tick();
setInterval(()=>{tick();if(todayKey()!==lastKey){lastKey=todayKey();rerender()}},1000);
})();
</script>

</body></html>
