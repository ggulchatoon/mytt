<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f5f2eb" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="힐링 딥워크" />
  <title>Deepwork Timer — 힐링 마운틴</title>
  <style>
    :root {
      --bg: #f5f2eb;
      --bg-gradient: linear-gradient(180deg, #f7f5ee 0%, #efebe2 100%);
      --panel: #ffffff;
      --panel-2: #fbf9f4;
      --line: rgba(60, 80, 55, 0.12);
      --line-strong: rgba(60, 80, 55, 0.22);
      --text: #232d25;
      --muted: #6e7d6d;
      --muted-light: #9aa799;
      --green-deep: #253d29;
      --green-main: #588548;
      --green-light: #7cb062;
      --green-soft: rgba(88, 133, 72, 0.12);
      --orange: #df7335;
      --orange-hover: #c96227;
      --orange-soft: rgba(223, 115, 53, 0.13);
      --cream-peak: #e8eed5;
      --card-shadow: 0 10px 30px rgba(50, 70, 45, 0.06);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Pretendard", Segoe UI, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    button, input, select { font: inherit; color: inherit; }
    input, select { font-size: 16px; }
    button { border: 0; cursor: pointer; }

    .app {
      height: 100dvh;
      min-height: 100svh;
      padding-top: max(10px, var(--safe-top));
      padding-bottom: calc(68px + max(8px, var(--safe-bottom)));
      display: flex;
      flex-direction: column;
      background: var(--bg-gradient);
      overflow: hidden;
    }

    /* Topbar */
    .topbar {
      flex: 0 0 auto;
      height: 82px;
      margin: 0 14px 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 22px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(14px);
    }
    .eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px; font-weight: 600; }
    .timer-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    #timerDisplay { font-size: 27px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--green-deep); }
    #timerState { font-size: 12px; color: var(--muted); white-space: nowrap; font-weight: 600; }
    .timer-actions { display: flex; align-items: center; gap: 6px; }
    
    .timer-btn {
      height: 52px; border-radius: 17px; padding: 0 16px;
      background: var(--orange); color: #ffffff; font-weight: 800; font-size: 14px;
      box-shadow: 0 8px 20px rgba(223, 115, 53, 0.28);
      transition: all .2s ease;
      white-space: nowrap;
    }
    .timer-btn:active { transform: scale(0.96); }
    .timer-btn.running {
      background: var(--green-deep);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(37, 61, 41, 0.25);
    }
    .timer-btn.paused {
      background: #e8dec8;
      color: #745422;
      box-shadow: none;
    }

    .timer-btn-record {
      height: 52px; border-radius: 17px; padding: 0 14px;
      background: #ffffff; color: var(--green-deep); font-weight: 700; font-size: 13px;
      border: 1px solid var(--line-strong);
      box-shadow: 0 4px 12px rgba(50, 70, 45, 0.08);
      display: none;
      white-space: nowrap;
      transition: all .2s ease;
    }
    .timer-btn-record.visible { display: block; }
    .timer-btn-record:active { transform: scale(0.96); opacity: 0.85; }

    main { flex: 1 1 auto; min-height: 0; margin: 0 14px; position: relative; }
    .panel { position: absolute; inset: 0; display: none; min-height: 0; }
    .panel.active { display: flex; flex-direction: column; }

    .section-head { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: end; margin: 2px 4px 8px; }
    .section-head h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.03em; color: var(--green-deep); }
    .section-head p { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--card-shadow); }

    /* Mountain Task Selector */
    .mountain-task-selector {
      flex: 0 0 auto;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 6px 12px;
      box-shadow: 0 4px 14px rgba(50, 70, 45, 0.04);
    }
    .mountain-task-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--orange);
      white-space: nowrap;
    }
    .mountain-task-select {
      flex: 1;
      height: 36px;
      background: transparent;
      border: none;
      padding: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      outline: none;
      text-overflow: ellipsis;
    }
    .mountain-task-select:disabled { opacity: 0.6; cursor: not-allowed; }
    .mountain-task-selector.locked {
      background: rgba(240, 237, 229, 0.9);
      border-color: rgba(223, 115, 53, 0.3);
    }
    .mountain-task-selector.locked .mountain-task-label::after {
      content: " 🔒";
      font-size: 10px;
    }

    /* Mountain Card & Storybook Sky */
    .mountain-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .sky-container {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #edf4f5;
    }
    .sky {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #e6f1f5 0%, #f7f5ed 65%, #edf3e8 100%);
      overflow: hidden;
    }

    /* Floating Clouds Animation */
    .cloud-drift-1 {
      animation: drift1 18s ease-in-out infinite alternate;
    }
    .cloud-drift-2 {
      animation: drift2 22s ease-in-out infinite alternate;
    }
    .cloud-drift-3 {
      animation: drift3 16s ease-in-out infinite alternate;
    }
    @keyframes drift1 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(12px, -3px); }
    }
    @keyframes drift2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-15px, 2px); }
    }
    @keyframes drift3 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(10px, -2px); }
    }

    .mountain-art { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    
    .mountain-art .trail-line {
      fill: none;
      stroke: rgba(223, 115, 53, 0.7);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 2 5;
      vector-effect: non-scaling-stroke;
    }

    /* Climber character styled like a cozy hiker with backpack */
    .climber {
      position: absolute;
      z-index: 12;
      width: 24px;
      height: 30px;
      transform: translate(-50%, -85%);
      transition: left .35s ease, top .35s ease;
      filter: drop-shadow(0 2px 4px rgba(35, 50, 30, 0.2));
    }
    .climber .backpack {
      position: absolute;
      left: 3px; top: 10px;
      width: 6px; height: 9px;
      background: #9b5a2b;
      border-radius: 3px;
    }
    .climber .head {
      position: absolute; left: 8px; top: 0;
      width: 10px; height: 10px;
      background: #df7335;
      border-radius: 50%;
    }
    .climber .hat {
      position: absolute; left: 6px; top: -1px;
      width: 14px; height: 4px;
      background: #395434;
      border-radius: 2px;
    }
    .climber .body {
      position: absolute; left: 11px; top: 9px;
      width: 4px; height: 12px;
      background: #253d29;
      border-radius: 2px;
      transform: rotate(-6deg);
    }
    .climber .arm, .climber .leg {
      position: absolute;
      width: 3px; height: 9px;
      background: #253d29;
      border-radius: 2px;
      transform-origin: top;
    }
    .climber .arm.a { left: 12px; top: 11px; transform: rotate(45deg); background: #df7335; }
    .climber .arm.b { left: 12px; top: 11px; transform: rotate(-45deg); background: #df7335; }
    .climber .leg.a { left: 12px; top: 19px; transform: rotate(30deg); }
    .climber .leg.b { left: 12px; top: 19px; transform: rotate(-30deg); }

    /* 활발하게 오르는 등산 애니메이션 */
    .climber.climbing {
      animation: climberBounce .4s infinite alternate ease-in-out;
    }
    .climber.climbing .body { animation: bodySway .4s infinite alternate ease-in-out; }
    .climber.climbing .arm.a { animation: armSwingA .4s infinite alternate ease-in-out; }
    .climber.climbing .arm.b { animation: armSwingB .4s infinite alternate ease-in-out; }
    .climber.climbing .leg.a { animation: legClimbA .4s infinite alternate ease-in-out; }
    .climber.climbing .leg.b { animation: legClimbB .4s infinite alternate ease-in-out; }

    @keyframes climberBounce {
      0% { transform: translate(-50%, -85%); }
      100% { transform: translate(-50%, -93%); }
    }
    @keyframes bodySway {
      0% { transform: rotate(-12deg); }
      100% { transform: rotate(-2deg); }
    }
    @keyframes armSwingA { 0% { transform: rotate(65deg); } 100% { transform: rotate(-30deg); } }
    @keyframes armSwingB { 0% { transform: rotate(-55deg); } 100% { transform: rotate(35deg); } }
    @keyframes legClimbA { 0% { transform: rotate(50deg); } 100% { transform: rotate(-30deg); } }
    @keyframes legClimbB { 0% { transform: rotate(-40deg); } 100% { transform: rotate(40deg); } }

    /* Summit Flag when 100% */
    .summit-flag {
      position: absolute;
      left: 50%; top: 6%;
      transform: translate(-30%, -100%);
      z-index: 10;
      display: none;
      animation: flagWave 1s infinite alternate ease-in-out;
    }
    .summit-flag.visible { display: block; }
    @keyframes flagWave {
      0% { transform: translate(-30%, -100%) rotate(-2deg); }
      100% { transform: translate(-30%, -100%) rotate(4deg); }
    }

    .mountain-stats {
      position: absolute; z-index: 15; left: 16px; top: 16px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 4px 15px rgba(50, 70, 45, 0.05);
    }
    .big-progress { font-size: 28px; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--green-deep); line-height: 1.1; }
    .big-progress span { color: var(--orange); }
    .goal-note { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 600; }

    /* Progress bar below mountain art */
    .progress-bar-section {
      flex: 0 0 auto;
      margin: 8px 14px 14px;
      height: 52px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 9px 13px;
      z-index: 10;
      box-shadow: 0 4px 14px rgba(50, 70, 45, 0.04);
    }
    .progress-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
    .track { height: 7px; background: #e8e3d8; border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--green-main) 0%, var(--orange) 100%); border-radius: 99px; transition: width .35s ease; }

    /* Deepwork */
    .deep-layout { flex: 1; min-height: 0; display: grid; grid-template-rows: auto auto 1fr; gap: 8px; }
    .goal-row { display: grid; grid-template-columns: 115px 1fr; gap: 8px; }
    .select, .text-input {
      width: 100%; height: 44px; background: var(--panel); border: 1px solid var(--line); border-radius: 15px; padding: 0 12px; outline: none; font-weight: 600;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(50, 70, 45, 0.03);
    }
    .select:focus, .text-input:focus { border-color: var(--green-main); box-shadow: 0 0 0 3px var(--green-soft); }
    .weekday-list { display: grid; grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 7px; min-height: 0; }
    .weekday-item {
      display: grid; grid-template-columns: 46px 1fr auto 28px; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-height: 0;
      box-shadow: 0 2px 8px rgba(50, 70, 45, 0.03);
    }
    .day { font-size: 12px; color: var(--muted); font-weight: 700; }
    .day.today { color: var(--orange); }
    .weekday-item input[type="text"] { width: 100%; min-width: 0; background: transparent; border: 0; outline: 0; font-size: 15px; font-weight: 600; }
    .task-time-badge { font-size: 11px; font-weight: 700; color: var(--green-deep); background: var(--green-soft); padding: 3px 7px; border-radius: 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .check { appearance: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line-strong); background: #fdfbf7; position: relative; cursor: pointer; }
    .check:checked { border-color: var(--green-main); background: var(--green-main); }
    .check:checked::after { content: ""; position: absolute; width: 7px; height: 4px; border-left: 2px solid #ffffff; border-bottom: 2px solid #ffffff; transform: rotate(-45deg); left: 5px; top: 6px; }

    /* Basket */
    .basket-layout { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .basket-add { display: grid; grid-template-columns: 1fr 92px 44px; gap: 7px; flex: 0 0 auto; }
    .add-btn { height: 44px; border-radius: 14px; background: var(--green-deep); color: #ffffff; font-size: 24px; line-height: 1; font-weight: 700; box-shadow: 0 4px 12px rgba(37, 61, 41, 0.2); }
    .basket-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 2px;
    }
    .basket-item {
      display: grid; grid-template-columns: 24px 1fr auto 24px; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-height: 46px; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(50, 70, 45, 0.03);
    }
    .basket-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .basket-item.done .basket-text { text-decoration: line-through; color: var(--muted-light); }
    .due { font-size: 11px; font-weight: 700; color: var(--orange); background: var(--orange-soft); padding: 5px 8px; border-radius: 999px; }
    .delete-btn { background: transparent; color: var(--muted); padding: 0; font-size: 18px; }
    .empty { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6; font-weight: 600; }
    .basket-foot { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; min-height: 18px; font-size: 11px; color: var(--muted); flex: 0 0 auto; font-weight: 600; }

    /* Work */
    .work-layout { flex: 1; min-height: 0; display: grid; grid-template-rows: auto 1fr; gap: 8px; }
    .summary-card { padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric + .metric { border-left: 1px solid var(--line); padding-left: 14px; }
    .metric-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .metric-value { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--green-deep); }
    .log-card { min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; }
    .log-head { height: 28px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 2px 6px; font-weight: 700; }
    .logs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; }
    .log-row {
      display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 8px;
      padding: 9px 12px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line);
    }
    .log-day { font-size: 11px; color: var(--orange); font-weight: 800; white-space: nowrap; }
    .log-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .log-task { font-size: 13px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .log-duration { font-size: 13px; font-weight: 800; color: var(--green-deep); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Bottom Nav */
    nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      height: calc(68px + max(8px, var(--safe-bottom)));
      padding: 0 8px max(8px, var(--safe-bottom));
      background: rgba(255, 255, 255, 0.94);
      border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(4, 1fr);
      backdrop-filter: blur(16px);
      box-shadow: 0 -4px 20px rgba(50, 70, 45, 0.05);
    }
    .tab { background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; position: relative; }
    .tab::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%) scaleX(0); width: 22px; height: 3px; border-radius: 99px; background: var(--green-main); transition: transform .18s ease; }
    .tab.active { color: var(--green-deep); font-weight: 800; }
    .tab.active::before { transform: translateX(-50%) scaleX(1); }

    .toast { position: fixed; z-index: 99; left: 50%; bottom: calc(78px + var(--safe-bottom)); transform: translate(-50%, 12px); background: var(--green-deep); color: #ffffff; border-radius: 999px; padding: 10px 16px; font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: .2s ease; white-space: nowrap; box-shadow: 0 8px 24px rgba(37, 61, 41, 0.25); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-height: 690px) {
      .topbar { height: 72px; margin-bottom: 7px; }
      #timerDisplay { font-size: 24px; }
      .timer-btn, .timer-btn-record { height: 46px; }
      .section-head { margin-bottom: 6px; }
      .section-head h1 { font-size: 19px; }
      .select, .text-input, .add-btn { height: 40px; }
      .weekday-item { padding: 5px 9px; }
      .summary-card { padding: 9px 12px; }
    }

    @media (min-width: 560px) {
      body { background: #e9e5dc; }
      .app { max-width: 480px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); box-shadow: 0 0 40px rgba(0,0,0,0.06); }
      nav { left: 50%; right: auto; transform: translateX(-50%); width: 480px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="dateLabel">오늘 · 9.16</div>
        <div class="timer-line">
          <span id="timerDisplay">00:00:00</span>
          <span id="timerState">준비됨</span>
        </div>
      </div>
      <div class="timer-actions">
        <button id="timerButton" class="timer-btn" aria-label="타이머 시작">시작</button>
        <button id="timerRecordButton" class="timer-btn-record" aria-label="타이머 기록">기록</button>
      </div>
    </header>

    <main>
      <!-- 산 오르기 패널 -->
      <section class="panel active" data-panel="mountain">
        <div class="section-head">
          <h1>산 오르기</h1>
          <p>하루 목표 4시간</p>
        </div>

        <div class="mountain-task-selector">
          <span class="mountain-task-label">집중 업무</span>
          <select id="mountainTaskSelect" class="mountain-task-select" aria-label="진행할 딥워크 태스크 선택">
            <option value="">🎯 자유 딥워크 (선택 안 함)</option>
          </select>
        </div>

        <div class="card mountain-card">
          <div class="sky-container">
            <div class="sky">
              <!-- Storybook Mountain SVG Canvas -->
              <svg class="mountain-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <!-- Warm sky gradient -->
                  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#eaf3f5"/>
                    <stop offset="60%" stop-color="#f7f5ed"/>
                    <stop offset="100%" stop-color="#edf3e8"/>
                  </linearGradient>

                  <!-- Mountain shading gradients -->
                  <linearGradient id="mntLit" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#84b868"/>
                    <stop offset="100%" stop-color="#699b51"/>
                  </linearGradient>
                  <linearGradient id="mntShadow" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#557e40"/>
                    <stop offset="100%" stop-color="#3d5e2d"/>
                  </linearGradient>
                  <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f7faea"/>
                    <stop offset="100%" stop-color="#e2ebce"/>
                  </linearGradient>

      <button class="tab active" data-tab="mountain">산 오르기</button>
      <button class="tab" data-tab="deepwork">딥워크</button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    const STORAGE_KEY = 'deepwork_timer_singlefile_v2';
    const LEGACY_STORAGE_KEY = 'deepwork_timer_singlefile_v1';
    const DAILY_GOAL_MS = 4 * 60 * 60 * 1000;
    const DAY_NAMES = ['일','월','화','수','목','금','토'];
    const WEEKDAYS = ['월','화','수','목','금'];
    const weekdayLong = ['월요일','화요일','수요일','목요일','금요일'];

    const $ = (q) => document.querySelector(q);
    const $$ = (q) => [...document.querySelectorAll(q)];

    const defaultGoal = (i) => ({
      name: `목표 ${i + 1}`,
      tasks: WEEKDAYS.map(() => ({ text: '', done: false }))
    });

    function getMonday(date = new Date()) {
      const d = new Date(date);
      d.setHours(0,0,0,0);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return d;
    }

    function dateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function currentWeekKey() { return dateKey(getMonday()); }

    function freshState() {
      return {
        weekKey: currentWeekKey(),
        sessions: [],
        timer: { running: false, paused: false, startMs: null, accumulatedMs: 0, activeTaskKey: '' },
        deep: { activeGoal: 0, goals: [defaultGoal(0), defaultGoal(1), defaultGoal(2)] },
        basket: [],
        activeTab: 'mountain'
      };
    }

    function normalizeState(raw) {
      const base = freshState();
      if (!raw || raw.weekKey !== base.weekKey) return base;
      const s = { ...base, ...raw };
      s.sessions = Array.isArray(raw.sessions) ? raw.sessions.filter(x => Number.isFinite(x.start) && Number.isFinite(x.end) && x.end >= x.start).map(x => ({
        id: String(x.id || cryptoId()),
        start: Number(x.start),
        end: Number(x.end),
        taskKey: String(x.taskKey || ''),
        taskName: String(x.taskName || ''),
        goalName: String(x.goalName || '')
      })) : [];

      s.timer = raw.timer && typeof raw.timer === 'object' ? {
        running: !!raw.timer.running,
        paused: !!raw.timer.paused,
        startMs: Number(raw.timer.startMs) || null,
        accumulatedMs: Number(raw.timer.accumulatedMs) || 0,
        activeTaskKey: String(raw.timer.activeTaskKey || '')
      } : base.timer;

      if (s.timer.running && (!s.timer.startMs || new Date(s.timer.startMs) < getMonday())) {
        s.timer = { running: false, paused: false, startMs: null, accumulatedMs: 0, activeTaskKey: '' };
      }

      s.deep = raw.deep && Array.isArray(raw.deep.goals) ? raw.deep : base.deep;
      s.deep.goals = [0,1,2].map(i => {
        const g = s.deep.goals[i] || defaultGoal(i);
        return {
          name: String(g.name || `목표 ${i+1}`).slice(0,26),
          tasks: WEEKDAYS.map((_, j) => ({ text: String(g.tasks?.[j]?.text || '').slice(0,60), done: !!g.tasks?.[j]?.done }))
        };
      });
      s.deep.activeGoal = Math.min(2, Math.max(0, Number(s.deep.activeGoal) || 0));
      s.basket = Array.isArray(raw.basket) ? raw.basket.map(item => ({ id: String(item.id || cryptoId()), text: String(item.text || '').slice(0,40), due: WEEKDAYS.includes(item.due) ? item.due : '금', done: !!item.done, createdAt: Number(item.createdAt) || Date.now() })) : [];
      s.activeTab = ['mountain','deepwork','basket','worktime'].includes(raw.activeTab) ? raw.activeTab : 'mountain';
      return s;
    }

    function loadState() {
      try {
        const v2 = localStorage.getItem(STORAGE_KEY);
        if (v2) return normalizeState(JSON.parse(v2));
        const v1 = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (v1) return normalizeState(JSON.parse(v1));
      } catch {}
      return freshState();
    }

    let state = loadState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function cryptoId() {
      if (window.crypto?.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function dayBounds(date = new Date()) {
      const start = new Date(date); start.setHours(0,0,0,0);
      const end = new Date(start); end.setDate(end.getDate() + 1);
      return [start.getTime(), end.getTime()];
    }

    function weekBounds() {
      const start = getMonday().getTime();
      const end = new Date(getMonday()); end.setDate(end.getDate() + 5); // Friday 24:00
      return [start, end.getTime()];
    }

    function overlap(start, end, rangeStart, rangeEnd) {
      return Math.max(0, Math.min(end, rangeEnd) - Math.max(start, rangeStart));
    }

    function isWeekdayDate(d) { const n = d.getDay(); return n >= 1 && n <= 5; }

    function recordedInRange(rangeStart, rangeEnd) {
      return state.sessions.reduce((sum, s) => sum + overlap(s.start, s.end, rangeStart, rangeEnd), 0);
    }

    function currentElapsedMs() {
      let total = state.timer.accumulatedMs || 0;
      if (state.timer.running && state.timer.startMs) {
        total += Math.max(0, Date.now() - state.timer.startMs);
      }
      return total;
    }

    function todayMs() {
      const [start, end] = dayBounds();
      let total = recordedInRange(start, end);
      if (state.timer.running || state.timer.paused) {
        total += currentElapsedMs();
      }
      return total;
    }

    function weekMs() {
      const [start, end] = weekBounds();
      let total = recordedInRange(start, end);
      if (state.timer.running || state.timer.paused) {
        total += currentElapsedMs();
      }
      return total;
    }

    function fmtHMS(ms) {
      const totalSec = Math.floor(Math.max(0, ms) / 1000);
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function fmtCompact(ms) {
      const min = Math.round(Math.max(0, ms) / 60000);
      const h = Math.floor(min / 60);
      const m = min % 60;
      if (!h) return `${m}분`;
      if (!m) return `${h}시간`;
      return `${h}시간 ${m}분`;
    }

    function fmtTime(ts) {
      const d = new Date(ts);
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    function renderTimer() {
      const display = $('#timerDisplay');
      const stateLabel = $('#timerState');
      const btn = $('#timerButton');
      const recordBtn = $('#timerRecordButton');

      const elapsed = currentElapsedMs();
      display.textContent = fmtHMS(elapsed);

      btn.classList.remove('running', 'paused');
      if (state.timer.running) {
        btn.textContent = '일시정지';
        btn.classList.add('running');
        stateLabel.textContent = '집중 오르는 중';
        recordBtn.classList.remove('visible');
      } else if (state.timer.paused) {
        btn.textContent = '이어하기';
        btn.classList.add('paused');
        stateLabel.textContent = '숨 고르는 중';
        recordBtn.classList.add('visible');
      } else {
        btn.textContent = '시작';
        stateLabel.textContent = '준비됨';
        recordBtn.classList.remove('visible');
      }

      renderMountainTaskSelect();
    }

    function renderMountainTaskSelect() {
      const select = $('#mountainTaskSelect');
      const container = $('.mountain-task-selector');
      if (!select) return;

      const isLocked = state.timer.running || state.timer.paused;
      select.disabled = isLocked;
      if (container) container.classList.toggle('locked', isLocked);

      let options = '<option value="">🎯 자유 딥워크 (선택 안 함)</option>';
      state.deep.goals.forEach((goal, gIdx) => {
        goal.tasks.forEach((t, tIdx) => {
          if (t.text.trim()) {
            const key = `${gIdx}_${tIdx}`;
            const label = `[${goal.name}] ${WEEKDAYS[tIdx]}요일 - ${t.text}`;
            const sel = (state.timer.activeTaskKey === key) ? 'selected' : '';
            options += `<option value="${key}" ${sel}>${escapeHtml(label)}</option>`;
          }
        });
      });
      select.innerHTML = options;
    }

    function handleTimerButtonClick() {
      const now = Date.now();
      if (!state.timer.running && !state.timer.paused) {
        state.timer.running = true;
        state.timer.paused = false;
        state.timer.startMs = now;
        state.timer.accumulatedMs = 0;
        showToast('등산을 시작합니다! 힘내세요 🌿');
      } else if (state.timer.running) {
        state.timer.running = false;
        state.timer.paused = true;
        state.timer.accumulatedMs += Math.max(0, now - state.timer.startMs);
        state.timer.startMs = null;
        showToast('잠시 숨을 고르고 있어요 ☕');
      } else if (state.timer.paused) {
        state.timer.running = true;
        state.timer.paused = false;
        state.timer.startMs = now;
        showToast('다시 정상을 향해 출발! 🏔️');
      }
      saveState();
      renderTimer();
      renderMountain();
    }

    function recordTimer() {
      if (!state.timer.paused && !state.timer.running) return;

      const now = Date.now();
      let total = state.timer.accumulatedMs || 0;
      if (state.timer.running && state.timer.startMs) {
        total += Math.max(0, now - state.timer.startMs);
      }

      if (total >= 60000) {
        let taskName = '';
        let goalName = '';
        if (state.timer.activeTaskKey) {
          const [gIdx, tIdx] = state.timer.activeTaskKey.split('_').map(Number);
          if (state.deep.goals[gIdx]) {
            goalName = state.deep.goals[gIdx].name;
            if (state.deep.goals[gIdx].tasks[tIdx]) {
              taskName = state.deep.goals[gIdx].tasks[tIdx].text;
            }
          }
        }

        const end = now;
        const start = end - total;
        state.sessions.unshift({
          id: cryptoId(),
          start,
          end,
          taskKey: state.timer.activeTaskKey || '',
          taskName,
          goalName
        });
        showToast(`기록 완료! +${fmtCompact(total)} 👏`);
      } else {
        showToast('1분 미만은 기록되지 않아요.');
      }

      state.timer.running = false;
      state.timer.paused = false;
      state.timer.startMs = null;
      state.timer.accumulatedMs = 0;
      state.timer.activeTaskKey = '';

      saveState();
      renderAll();
    }

    function renderMountain() {
      const t = todayMs();
      const p = Math.min(1, t / DAILY_GOAL_MS);
      const pct = Math.floor(p * 100);

      $('#mountainPct').textContent = String(pct);
      $('#todayAccumulated').textContent = `오늘 ${fmtCompact(t)} 쌓음`;
      $('#mountainFill').style.width = `${pct}%`;

      const remain = Math.max(0, DAILY_GOAL_MS - t);
      $('#remainingLabel').textContent = remain ? `정상까지 ${fmtCompact(remain)}` : '오늘 정상 정복 완료! 🎉';

      // 100% 정상 도달 시 깃발 표시
      const flag = $('#summitFlag');
      if (flag) {
        flag.classList.toggle('visible', pct >= 100);
      }

      // 등산객 애니메이션 및 경로 이동
      const climber = $('#climber');
      if (climber) {
        climber.classList.toggle('climbing', !!state.timer.running);
      }

      const climbPath = $('#climbTrail');
      if (climbPath && climber) {
        const totalLength = climbPath.getTotalLength();
        const point = climbPath.getPointAtLength(totalLength * p);
        climber.style.left = `${point.x}%`;
        climber.style.top = `${point.y}%`;
      }
    }

    function refreshGoalSelect() {
      const select = $('#goalSelect');
      select.innerHTML = state.deep.goals.map((g,i) => `<option value="${i}">${escapeHtml(g.name || `목표 ${i+1}`)}</option>`).join('');
      select.value = String(state.deep.activeGoal);
    }

    function renderDeep() {
      refreshGoalSelect();
      const idx = state.deep.activeGoal;
      const goal = state.deep.goals[idx];
      $('#goalName').value = goal.name;
      const today = new Date().getDay();

      const taskTimes = {};
      state.sessions.forEach(s => {
        if (s.taskKey) {
          taskTimes[s.taskKey] = (taskTimes[s.taskKey] || 0) + (s.end - s.start);
        }
      });

      $('#weekdayList').innerHTML = goal.tasks.map((task, i) => {
        const key = `${idx}_${i}`;
        const timeSpent = taskTimes[key] || 0;
        const badgeHtml = timeSpent > 0 ? `<span class="task-time-badge">${fmtCompact(timeSpent)}</span>` : '';
        return `
        <label class="weekday-item">
          <span class="day ${today === i + 1 ? 'today' : ''}">${weekdayLong[i]}</span>
          <input type="text" data-task-text="${i}" maxlength="60" placeholder="${weekdayLong[i]} 딥워크" value="${escapeAttr(task.text)}" />
          ${badgeHtml}
          <input class="check" type="checkbox" data-task-done="${i}" ${task.done ? 'checked' : ''} aria-label="${weekdayLong[i]} 완료" />
        </label>`;
      }).join('');
    }

    function renderBasket() {
      const dayOrder = { '월': 1, '화': 2, '수': 3, '목': 4, '금': 5 };
      const list = [...state.basket].sort((a,b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const orderA = dayOrder[a.due] || 99;
        const orderB = dayOrder[b.due] || 99;
        if (orderA !== orderB) return orderA - orderB;
        return b.createdAt - a.createdAt;
      });

      const unDoneCount = state.basket.filter(x => !x.done).length;
      $('#basketCount').textContent = `총 ${state.basket.length}개`;
      $('#basketRemaining').textContent = `${unDoneCount}개 남음`;

      if (!list.length) {
        $('#basketList').innerHTML = '<div class="empty">머릿속에 떠오른 일을 바구니에 넣고<br>마감 요일만 정해두세요 🧺</div>';
        return;
      }

      $('#basketList').innerHTML = list.map(item => `
        <div class="basket-item ${item.done ? 'done' : ''}" data-id="${escapeAttr(item.id)}">
          <input class="check" type="checkbox" data-basket-check="${escapeAttr(item.id)}" ${item.done ? 'checked' : ''} aria-label="완료" />
          <div class="basket-text" title="${escapeAttr(item.text)}">${escapeHtml(item.text)}</div>
          <span class="due">${escapeHtml(item.due)} 마감</span>
          <button class="delete-btn" data-basket-delete="${escapeAttr(item.id)}" aria-label="삭제">×</button>
        </div>`).join('');
    }

    function renderWork() {
      $('#todayTotal').textContent = fmtCompact(todayMs());
      $('#weekTotal').textContent = fmtCompact(weekMs());
      $('#sessionCount').textContent = `${state.sessions.length}건`;
      const list = [...state.sessions].sort((a,b) => b.end - a.end);

      if (!list.length) {
        $('#logList').innerHTML = '<div class="empty">타이머를 멈추고 기록하면<br>여기에 하루의 발자국이 남아요 👣</div>';
        return;
      }

      $('#logList').innerHTML = list.map(s => {
        const d = new Date(s.end);
        const day = DAY_NAMES[d.getDay()] + '요일';
        const taskLabel = s.taskName ? `${s.goalName ? '[' + s.goalName + '] ' : ''}${s.taskName}` : '자유 딥워크';
        return `
          <div class="log-row">
            <span class="log-day">${day}</span>
            <div class="log-body">
              <div class="log-task">${escapeHtml(taskLabel)}</div>
              <div class="log-time">${fmtTime(s.start)}–${fmtTime(s.end)}</div>
            </div>
            <strong class="log-duration">${fmtCompact(s.end - s.start)}</strong>
          </div>`;
      }).join('');
    }

    function renderDate() {
      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      $('#dateLabel').textContent = `오늘 · ${m}.${d} (${DAY_NAMES[now.getDay()]})`;
    }

    function renderTabs() {
      $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.activeTab));
      $$('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === state.activeTab));
    }

    function renderAll() {
      renderDate(); renderTimer(); renderTabs(); renderMountain(); renderDeep(); renderBasket(); renderWork();
    }

    function showToast(msg) {
      const el = $('#toast'); el.textContent = msg; el.classList.add('show');
      clearTimeout(showToast.t); showToast.t = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function escapeHtml(s='') { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escapeAttr(s='') { return escapeHtml(s).replace(/`/g,'&#96;'); }

    // Event Listeners
    $('#timerButton').addEventListener('click', handleTimerButtonClick);
    $('#timerRecordButton').addEventListener('click', recordTimer);

    $('#mountainTaskSelect').addEventListener('change', e => {
      if (state.timer.running || state.timer.paused) {
        showToast('타이머 진행 중에는 업무를 바꿀 수 없어요 🔒');
        e.target.value = state.timer.activeTaskKey || '';
        return;
      }
      state.timer.activeTaskKey = e.target.value;
      saveState();
    });

    $$('.tab').forEach(btn => btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab; saveState(); renderTabs();
      if (state.activeTab === 'mountain') renderMountainTaskSelect();
    }));

    $('#goalSelect').addEventListener('change', e => {
      state.deep.activeGoal = Number(e.target.value); saveState(); renderDeep();
    });

    $('#goalName').addEventListener('input', e => {
      state.deep.goals[state.deep.activeGoal].name = e.target.value || `목표 ${state.deep.activeGoal + 1}`;
      saveState(); refreshGoalSelect(); renderMountainTaskSelect();
    });

    $('#weekdayList').addEventListener('input', e => {
      if (e.target.matches('[data-task-text]')) {
        state.deep.goals[state.deep.activeGoal].tasks[Number(e.target.dataset.taskText)].text = e.target.value;
        saveState(); renderMountainTaskSelect();
      }
    });
    $('#weekdayList').addEventListener('change', e => {
      if (e.target.matches('[data-task-done]')) {
        state.deep.goals[state.deep.activeGoal].tasks[Number(e.target.dataset.taskDone)].done = e.target.checked;
        saveState();
      }
    });

    function addBasket() {
      const input = $('#basketInput');
      const text = input.value.trim();
      if (!text) { showToast('바구니에 넣을 일을 적어주세요.'); input.focus(); return; }
      state.basket.push({ id: cryptoId(), text, due: $('#basketDue').value, done: false, createdAt: Date.now() });
      input.value = ''; saveState(); renderBasket();
    }
    $('#basketAdd').addEventListener('click', addBasket);
    $('#basketInput').addEventListener('keydown', e => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        addBasket();
      }
    });
    $('#basketList').addEventListener('change', e => {
      const id = e.target.dataset.basketCheck;
      if (!id) return;
      const item = state.basket.find(x => x.id === id);
      if (item) { item.done = e.target.checked; saveState(); renderBasket(); }
    });
    $('#basketList').addEventListener('click', e => {
      const id = e.target.dataset.basketDelete;
      if (!id) return;
      state.basket = state.basket.filter(x => x.id !== id); saveState(); renderBasket();
    });

    window.addEventListener('storage', e => {
      if (e.key === STORAGE_KEY) { state = loadState(); renderAll(); }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { state = loadState(); renderAll(); } });

    setInterval(() => {
      renderTimer();
      if (state.timer.running) { renderMountain(); renderWork(); }
    }, 1000);

    saveState();
    renderAll();
  })();
  </script>
</body>
</html>
