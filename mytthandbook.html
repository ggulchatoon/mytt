<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>시간관리 도감 · 나의 시간 농장 핸드북</title>
<meta name="theme-color" content="#F6F7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root {
  color-scheme: light;
  --bg:          #F6F7F2;   /* 내추럴 크림/아이보리 */
  --paper:       #FFFFFF;   /* 순백색 */
  --sage-bg:     #F0F4EE;   /* 은은한 세이지 틴트 */
  --sage-soft:   #E3ECE0;   /* 톤온톤 세이지 포인트 배경 */
  --green:       #3B7A57;   /* 메인 세이지 포레스트 그린 */
  --green-dk:    #1E2B23;   /* 짙은 쑥빛 먹물색 */
  --coral:       #E59560;   /* 서브 웜 코랄 오렌지 (최소 면적 포인트) */
  --coral-dk:    #C8733B;
  --ink:         #1E2B23;   /* 기본 글자색 */
  --ink-sub:     #56655B;   /* 보조 글자색 */
  --ink-muted:   #86938A;   /* 캡션/힌트 글자색 */
  --border:      #DCE2D7;   /* 세이지 그레이 라인 */
  --border-lt:   #E8EDE4;   /* 옅은 구분선 */
  --shadow:      rgba(30, 43, 35, 0.045);

  --serif: 'Noto Serif KR', Georgia, serif;
  --sans:  'Pretendard', -apple-system, BlinkMacSystemFont, 'Gowun Dodum', sans-serif;

  --r-lg: 18px;
  --r-md: 12px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--sans);
  font-size: 15.5px;
  line-height: 1.74;
  letter-spacing: -0.015em;
  word-break: keep-all;
}

button, input {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

button {
  cursor: pointer;
}

#app {
  max-width: 440px;
  min-height: 100vh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
}

/* ── 상단 네비게이션 헤더 ── */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 12px;
  background: rgba(246, 247, 242, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
}

.top-bar.lined {
  border-bottom-color: var(--border);
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--paper);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  box-shadow: 0 2px 6px var(--shadow);
  transition: transform 0.12s ease;
  flex-shrink: 0;
}

.icon-btn:active {
  transform: scale(0.95);
}

.icon-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
}

.top-title {
  font-family: var(--serif);
  font-size: 16.5px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.02em;
  text-align: center;
  padding: 0 8px;
}

.view {
  padding: 8px 20px 24px;
  flex: 1;
}

/* ═════════ 1. 메인 화면 (시간관리 도감) ═════════ */
.hero-ask {
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.03em;
  line-height: 1.3;
  margin: 8px 2px 16px;
}

.search-box {
  position: relative;
  margin-bottom: 16px;
}

.search-box svg {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--ink-muted);
  pointer-events: none;
}

.search-in {
  width: 100%;
  height: 50px;
  padding: 0 40px 0 44px;
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  font-size: 15px;
  color: var(--ink);
  outline: none;
  box-shadow: 0 2px 8px var(--shadow);
  transition: border-color 0.18s ease;
}

.search-in::placeholder {
  color: #9BA69E;
}

.search-in:focus {
  border-color: var(--green);
}

.search-clear {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  color: var(--ink-sub);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.search-clear.show {
  display: flex;
}

/* 카테고리 탭 (알약 대신 깔끔한 에디토리얼 언더라인 탭) */
.cat-bar {
  display: flex;
  gap: 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  padding: 0 4px;
  overflow-x: auto;
  scrollbar-width: none;
}

.cat-bar::-webkit-scrollbar {
  display: none;
}

.cat-tab {
  position: relative;
  padding: 8px 2px 11px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink-muted);
  white-space: nowrap;
  transition: color 0.15s ease;
}

.cat-tab.active {
  color: var(--ink);
  font-weight: 700;
}

.cat-tab.active::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2.5px;
  background: var(--green);
}

/* 챕터 카드 리스트 (클릭 시 그린 톤온톤 강조) */
.ch-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.ch-card {
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: 0 2px 10px var(--shadow);
  overflow: hidden;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

/* 1번 피드백: 클릭 시 그린 색 톤온톤 라인 강조 */
.ch-card.open {
  border-color: var(--green);
  box-shadow: 0 6px 18px rgba(59, 122, 87, 0.10);
}

.ch-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 19px 20px;
  text-align: left;
  transition: background 0.18s ease;
}

.ch-card.open .ch-head {
  background: #F7FAF6;
}

.ch-num {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 700;
  color: var(--green);
  min-width: 28px;
  letter-spacing: -0.02em;
}

.ch-info {
  flex: 1;
  min-width: 0;
}

.ch-title {
  font-size: 16.5px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  margin-bottom: 2px;
}

.ch-tags {
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.4;
}

.ch-cnt {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--sage-bg);
  color: var(--green);
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s ease, color 0.2s ease;
}

.ch-card.open .ch-cnt {
  background: var(--green);
  color: #FFFFFF;
}

/* 아코디언 하위 목록 */
.sub-list {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--paper);
  padding: 4px 18px 8px;
}

.ch-card.open .sub-list {
  display: block;
}

.sub-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 2px;
  text-align: left;
}

.sub-item + .sub-item {
  border-top: 1px solid var(--border-lt);
}

.sub-left {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}

.sub-code {
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--green);
  flex-shrink: 0;
}

.sub-name {
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.45;
}

.sub-item.ready .sub-name {
  font-weight: 700;
}

.sub-mark {
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
  border-bottom: 1.5px solid var(--green);
  padding-bottom: 1px;
}

.sub-chev {
  flex-shrink: 0;
  color: var(--ink-muted);
  font-size: 15px;
}

/* ═════════ 2. 상세페이지 (라인 박스 없이 화이트 배경으로 구분하는 북 레이아웃) ═════════ */
/* 상단 꼭지 인덱스 바 (크림 배경 위 언더라인 인덱스) */
.idx-strip {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  margin: -4px 0 0;
  padding: 2px 2px 10px;
  scrollbar-width: none;
}

.idx-strip::-webkit-scrollbar {
  display: none;
}

.idx-item {
  position: relative;
  padding: 6px 2px 8px;
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink-muted);
  white-space: nowrap;
}

.idx-item.active {
  color: var(--green);
}

.idx-item.active::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: var(--green);
}

/* 상세 원고 화이트 배경 (외곽 라인 박스 제거, 상단 1.1.. 및 하단 다음고민 크림 배경과 자연 구분) */
.book-sheet {
  background: var(--paper);
  margin: 0 -20px;
  padding: 30px 22px 32px;
}

/* 챕터/번호 인덱스 + 본문 대제목 */
.art-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
  margin-bottom: 8px;
}

.art-meta b {
  font-family: var(--serif);
  font-weight: 700;
}

.art-meta i {
  width: 1px;
  height: 11px;
  background: var(--border);
}

.art-title {
  font-family: var(--serif);
  font-size: 23px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.4;
  letter-spacing: -0.025em;
  padding-bottom: 22px;
  border-bottom: 1.5px solid var(--ink);
}

/* 라인 구분 섹션 */
.sec-block {
  padding: 24px 0;
  border-bottom: 1px solid var(--border);
}

.sec-block:last-of-type {
  border-bottom: none;
  padding-bottom: 4px;
}

.sec-label {
  font-family: var(--serif);
  font-size: 18.5px;
  font-weight: 700;
  color: var(--green);
  line-height: 1.4;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}

.body-p {
  font-size: 15.5px;
  color: var(--ink);
  line-height: 1.78;
}

.body-p + .sec-label {
  margin-top: 26px;
}

.hl {
  background: linear-gradient(transparent 62%, rgba(59, 122, 87, 0.16) 62%);
  font-weight: 600;
}

/* 예시 + 간결한 비포/애프터 표 + 행동 문구 통합 섹션 (제안과 라인 없이 연결) */
.ex-line {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink-sub);
  margin-top: 22px;
  margin-bottom: 12px;
}

.ex-line b {
  color: var(--green);
  margin-right: 4px;
}

/* 비포 애프터 표: 라인 + 박스 2종류(Before 열 / After 열)만으로 간결하게 */
.ba-table {
  border-top: 1.5px solid var(--ink);
  border-bottom: 1px solid var(--border);
}

.ba-head {
  display: grid;
  grid-template-columns: 44px 1fr 1fr;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
  font-weight: 700;
  word-break: keep-all;
}

.ba-head > div {
  padding: 9px 10px;
  line-height: 1.38;
}

.ba-head .ba-en {
  display: block;
  font-size: 10.5px;
  letter-spacing: 0.04em;
  opacity: 0.78;
  margin-bottom: 1px;
}

.ba-head .h-bef {
  color: var(--ink-sub);
  border-left: 1px solid var(--border-lt);
}

.ba-head .h-aft {
  color: var(--green);
  background: var(--sage-bg);
  border-left: 1px solid var(--border);
}

.ba-row {
  display: grid;
  grid-template-columns: 44px 1fr 1fr;
  font-size: 14px;
  line-height: 1.56;
}

.ba-row + .ba-row {
  border-top: 1px solid var(--border-lt);
}

.ba-row .r-key {
  padding: 12px 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
}

.ba-row .r-bef {
  padding: 12px 11px;
  color: var(--ink-sub);
  border-left: 1px solid var(--border-lt);
}

.ba-row .r-aft {
  padding: 12px 11px;
  color: var(--ink);
  font-weight: 600;
  background: var(--sage-bg);
  border-left: 1px solid var(--border);
}

/* 통합된 오늘 실천 문구 + 지금 해보기 버튼 (코랄 오렌지는 작은 포인트로만 한정) */
.act-inline {
  margin-top: 18px;
  padding-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.act-copy {
  font-family: var(--serif);
  font-size: 16.5px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.5;
  flex: 1;
}

.act-btn {
  position: relative;
  flex-shrink: 0;
  padding: 9px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--coral);
  background: var(--paper);
  color: var(--coral-dk);
  font-size: 13.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.12s ease, background 0.18s ease, color 0.18s ease;
  overflow: visible;
}

.act-btn:active {
  transform: scale(0.95);
}

.act-btn .coral-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--coral);
  transition: background 0.18s ease;
}

.act-btn.done {
  background: var(--coral);
  color: #FFFFFF;
}

.act-btn.done .coral-dot {
  background: #FFFFFF;
}

/* 함께 읽으면 좋아요 (라인 리스트) */
.rel-ul {
  list-style: none;
  margin-top: 4px;
}

.rel-li + .rel-li {
  border-top: 1px dashed var(--border-lt);
}

.rel-link {
  width: 100%;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  text-align: left;
}

.rel-link:active .rel-name {
  color: var(--green);
}

.rel-left {
  display: flex;
  align-items: baseline;
  gap: 9px;
}

.rel-code {
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--green);
}

.rel-name {
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
}

/* 관련자료 */
.ref-block {
  padding-top: 18px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}

.ref-head {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-muted);
  margin-bottom: 6px;
}

.ref-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.ref-list li {
  font-size: 12.5px;
  color: var(--ink-muted);
  line-height: 1.55;
}

/* ── 맨 마지막 책장 넘기기형 에디토리얼 푸터 네비게이션 (크림 배경 위) ── */
.book-footer {
  margin-top: 8px;
  border-bottom: 1px solid var(--border);
}

.next-page-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 4px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  transition: opacity 0.15s ease;
}

.next-page-row:active {
  opacity: 0.7;
}

.np-meta {
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
  margin-bottom: 2px;
}

.np-meta b {
  font-family: var(--serif);
}

.np-title {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
}

.np-arrow {
  font-size: 18px;
  color: var(--ink);
  flex-shrink: 0;
}

.index-back-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 4px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-sub);
}

.index-back-row:active {
  color: var(--ink);
}

/* ── 컨페티(폭죽 파티클) 캔버스 오버레이 ── */
.burst-wrap {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 200;
  overflow: hidden;
}

.particle {
  position: absolute;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

/* ── 전체 목차 서랍(Drawer) 모달 ── */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(30, 43, 35, 0.36);
  z-index: 90;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.drawer-backdrop.show {
  display: flex;
}

.drawer-sheet {
  width: 100%;
  max-width: 440px;
  max-height: 82vh;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
}

.drawer-head {
  padding: 18px 20px 14px;
  background: var(--paper);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.drawer-head b {
  font-family: var(--serif);
  font-size: 16.5px;
  color: var(--ink);
}

.drawer-close {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-sub);
  padding: 4px 8px;
}

.drawer-body {
  padding: 14px 18px 28px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.dw-ch-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--green);
  margin-bottom: 6px;
}

.dw-items {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.dw-item {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 11px 14px;
  text-align: left;
  font-size: 13.5px;
}

.dw-item + .dw-item {
  border-top: 1px solid var(--border-lt);
}

.dw-item b {
  font-family: var(--serif);
  font-size: 12.5px;
  color: var(--green);

  /* ═════════ 3. 상태 및 유틸리티 ═════════ */
  const CATEGORIES = ['전체', '시작', '집중', '마음', '쉼'];
  let state = {
    mode: 'home',
    cat: '전체',
    query: '',
    openCh: 1,
    curCode: '1.1',
    checkedActions: JSON.parse(localStorage.getItem('mytt_handbook_v5_checked') || '{}')
  };

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
  }

  function findItemMeta(code) {
    for (const ch of CHAPTERS) {
      for (const [c, name] of ch.items) {
        if (c === code) return { code: c, name, ch };
      }
    }
    return null;
  }

  /* ── 파티클 폭죽(Burst) 효과 ── */
  function triggerBurst(btnEl) {
    const rect = btnEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const wrap = $('#burstWrap');
    const colors = ['#E59560', '#3B7A57', '#F2C185', '#7BA88E', '#D97D54', '#1E2B23'];

    for (let i = 0; i < 28; i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      const size = 5 + Math.random() * 5;
      const isCircle = Math.random() > 0.45;
      p.style.width = `${size}px`;
      p.style.height = `${isCircle ? size : size * 1.6}px`;
      if (isCircle) p.style.borderRadius = '50%';
      p.style.background = colors[i % colors.length];
      p.style.left = `${cx}px`;
      p.style.top = `${cy}px`;
      wrap.appendChild(p);

      const angle = (Math.PI * 2 * i) / 28 + (Math.random() - 0.5) * 0.35;
      const velocity = 42 + Math.random() * 68;
      const dx = Math.cos(angle) * velocity;
      const dy = Math.sin(angle) * velocity - 24;
      const rot = (Math.random() - 0.5) * 520;

      const anim = p.animate([
        { transform: 'translate(-50%, -50%) scale(0.4) rotate(0deg)', opacity: 1 },
        { transform: `translate(calc(-50% + ${dx * 0.75}px), calc(-50% + ${dy * 0.75}px)) scale(1.05) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.45 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 42}px)) scale(0.6) rotate(${rot}deg)`, opacity: 0 }
      ], {
        duration: 620 + Math.random() * 240,
        easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
      });
      anim.onfinish = () => p.remove();
    }
  }

  /* ═════════ 4. 메인 화면 렌더링 ═════════ */
  function renderHome() {
    $('#topTitle').textContent = '시간관리 도감';
    $('#topBar').classList.remove('lined');
    const q = state.query.trim().toLowerCase();

    const filtered = CHAPTERS.map(ch => {
      if (state.cat !== '전체' && ch.cat !== state.cat) return null;
      if (!q) return { ch, matchedItems: ch.items };
      const chMatch = ch.title.toLowerCase().includes(q) || ch.tags.toLowerCase().includes(q);
      const itemMatches = ch.items.filter(([c, t]) => {
        const a = ARTICLES[c];
        return c.includes(q) || t.toLowerCase().includes(q) ||
          (a && (a.symptom.toLowerCase().includes(q) || a.proposalTitle.toLowerCase().includes(q) || a.proposalBody.toLowerCase().includes(q)));
      });
      if (chMatch) return { ch, matchedItems: ch.items };
      if (itemMatches.length) return { ch, matchedItems: itemMatches };
      return null;
    }).filter(Boolean);

    $('#mainView').innerHTML = `
      <h1 class="hero-ask">지금 나의 고민은?</h1>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input type="text" class="search-in" id="searchIn" placeholder="예: 미루기, 자책, 방전" value="${esc(state.query)}" autocomplete="off">
        <button class="search-clear ${state.query ? 'show' : ''}" id="searchClear" aria-label="검색어 지우기">✕</button>
      </div>

      <div class="cat-bar">
        ${CATEGORIES.map(c => `
          <button class="cat-tab ${state.cat === c ? 'active' : ''}" data-cat="${c}">${c}</button>
        `).join('')}
      </div>

      <div class="ch-list">
        ${filtered.length ? filtered.map(({ ch, matchedItems }) => {
          const isOpen = q ? true : state.openCh === ch.id;
          return `
            <section class="ch-card ${isOpen ? 'open' : ''}" data-chid="${ch.id}">
              <button class="ch-head" data-toggle="${ch.id}" aria-expanded="${isOpen}">
                <span class="ch-num">${ch.num}</span>
                <div class="ch-info">
                  <div class="ch-title">${esc(ch.title)}</div>
                  <div class="ch-tags">${esc(ch.tags)}</div>
                </div>
                <span class="ch-cnt">${ch.items.length}</span>
              </button>
              <div class="sub-list">
                ${matchedItems.map(([code, name]) => {
                  const isDone = !!state.checkedActions[code];
                  return `
                    <button class="sub-item" data-open="${code}">
                      <div class="sub-left">
                        <span class="sub-code">${code}</span>
                        <span class="sub-name">${esc(name)}</span>
                      </div>
                      ${isDone ? '<span class="sub-mark">실천 완료</span>' : '<span class="sub-chev">›</span>'}
                    </button>
                  `;
                }).join('')}
              </div>
            </section>
          `;
        }).join('') : `
          <div style="text-align:center;color:var(--ink-sub);padding:38px 20px">
            일치하는 고민을 찾지 못했어요.<br>다른 단어로 검색해 보세요.
          </div>
        `}
      </div>
    `;

    bindHomeEvents();
  }

  function bindHomeEvents() {
    const sin = $('#searchIn');
    const scl = $('#searchClear');
    sin.oninput = () => {
      state.query = sin.value;
      const pos = sin.selectionStart;
      renderHome();
      const nextIn = $('#searchIn');
      nextIn.focus();
      nextIn.setSelectionRange(pos, pos);
    };
    scl.onclick = () => {
      state.query = '';
      renderHome();
    };

    document.querySelectorAll('[data-cat]').forEach(b => {
      b.onclick = () => {
        state.cat = b.dataset.cat;
        renderHome();
      };
    });

    document.querySelectorAll('[data-toggle]').forEach(b => {
      b.onclick = () => {
        const id = Number(b.dataset.toggle);
        state.openCh = state.openCh === id ? null : id;
        renderHome();
      };
    });

    document.querySelectorAll('[data-open]').forEach(b => {
      b.onclick = () => openArticle(b.dataset.open);
    });
  }

  /* ═════════ 5. 상세페이지 화면 렌더링 (라인 구분 · 간결한 표 · 통합 액션) ═════════ */
  function openArticle(code) {
    if (!ARTICLES[code]) {
      const meta = findItemMeta(code);
      toast(`${code} '${meta ? meta.name : ''}' 원고는 준비 중입니다`);
      return;
    }
    const meta = findItemMeta(code);
    if (meta) state.openCh = meta.ch.id;
    state.mode = 'detail';
    state.curCode = code;
    window.scrollTo({ top: 0, behavior: 'instant' });
    renderDetail();
  }

  function renderDetail() {
    const art = ARTICLES[state.curCode];
    const meta = findItemMeta(state.curCode);
    const ch = meta.ch;
    const isChecked = !!state.checkedActions[art.code];

    $('#topTitle').textContent = `${ch.num}. ${ch.title}`;
    $('#topBar').classList.add('lined');

    const allItems = CHAPTERS.flatMap(c => c.items);

    const nextItem = allItems[(flatIdx + 1) % allItems.length];

    $('#mainView').innerHTML = `

      <nav class="idx-strip" aria-label="소주제 이동">

                    </span>
                    <span class="sub-chev">›</span>
                  </button>

              `;

  }

  $('#menuBtn').onclick = () => {
    renderDrawer();
    $('#drawer').classList.add('show');
  };

  $('#drawerClose').onclick = () => $('#drawer').classList.remove('show');
  $('#drawer').onclick = e => {
    if (e.target.id === 'drawer') $('#drawer').classList.remove('show');
  };

  renderHome();
})();
</script>
</body>
</html>
